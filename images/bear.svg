<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
  <!-- StayTW Study 吉祥物：可愛版台灣黑熊（胸前白色 V 是台灣黑熊的招牌）＋珍珠奶茶 -->
  <!-- 耳朵 -->
  <circle cx="62" cy="52" r="30" fill="#3B3A3E"/>
  <circle cx="198" cy="52" r="30" fill="#3B3A3E"/>
  <circle cx="62" cy="54" r="15" fill="#5A575E"/>
  <circle cx="198" cy="54" r="15" fill="#5A575E"/>
  <!-- 頭 -->
  <circle cx="130" cy="102" r="82" fill="#3B3A3E"/>
  <!-- 身體 -->
  <rect x="58" y="158" width="144" height="118" rx="58" fill="#3B3A3E"/>
  <!-- 胸前白 V -->
  <path d="M92 196 L130 238 L168 196" fill="none" stroke="#F7F3EA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 口鼻 -->
  <ellipse cx="130" cy="124" rx="32" ry="24" fill="#E9DCC8"/>
  <ellipse cx="130" cy="116" rx="11" ry="8.5" fill="#2A292C"/>
  <path d="M130 126 q0 8 -9 10 M130 126 q0 8 9 10" fill="none" stroke="#2A292C" stroke-width="3.4" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <circle cx="94" cy="92" r="9" fill="#1D1C1F"/>
  <circle cx="166" cy="92" r="9" fill="#1D1C1F"/>
  <circle cx="97.5" cy="88.5" r="3.2" fill="#FFF"/>
  <circle cx="169.5" cy="88.5" r="3.2" fill="#FFF"/>
  <!-- 腮紅 -->
  <ellipse cx="76" cy="118" rx="12" ry="7.5" fill="#E9938A" opacity=".55"/>
  <ellipse cx="184" cy="118" rx="12" ry="7.5" fill="#E9938A" opacity=".55"/>
  <!-- 左手（垂下） -->
  <ellipse cx="66" cy="206" rx="20" ry="30" fill="#333236" transform="rotate(14 66 206)"/>
  <!-- 珍珠奶茶 -->
  <g transform="rotate(-6 206 216)">
    <path d="M186 186 L226 186 L221 250 L191 250 Z" fill="#E8C9A0"/>
    <path d="M191 224 L221 224 L219 250 L193 250 Z" fill="#C89B66"/>
    <circle cx="199" cy="243" r="3.6" fill="#3B2E23"/>
    <circle cx="208" cy="246" r="3.6" fill="#3B2E23"/>
    <circle cx="215" cy="241" r="3.6" fill="#3B2E23"/>
    <circle cx="203" cy="235" r="3.6" fill="#3B2E23"/>
    <rect x="184" y="182" width="44" height="7" rx="3.5" fill="#B8362A"/>
    <rect x="209" y="150" width="7" height="38" rx="3.5" fill="#B8362A" transform="rotate(9 212 169)"/>
  </g>
  <!-- 右手（扶著奶茶） -->
  <ellipse cx="192" cy="212" rx="19" ry="27" fill="#3B3A3E" transform="rotate(-24 192 212)"/>
  <!-- 腳 -->
  <ellipse cx="96" cy="276" rx="26" ry="17" fill="#333236"/>
  <ellipse cx="164" cy="276" rx="26" ry="17" fill="#333236"/>
  <ellipse cx="96" cy="278" rx="14" ry="8.5" fill="#E9DCC8"/>
  <ellipse cx="164" cy="278" rx="14" ry="8.5" fill="#E9DCC8"/>
</svg>
