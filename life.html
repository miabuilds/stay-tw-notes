function t(k){ const d = T[lang()]; return d[k] !== undefined ? d[k] : T.en[k]; }
// 内容の訳：ja/en は life.js に直接、ko/vi/id は life-tr.js の英文→訳マップ。無ければ英語。
function tr(m){ const l = lang(); if (m[l]) return m[l]; const TR = (window.LIFE_TR || {})[l]; return (TR && TR[m.en]) || m.en; }
function applyLang(){
  document.documentElement.lang = lang();
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.getAttribute("data-i18n-ph")); });
  document.getElementById("langBtn").textContent = LABEL[lang()];
  renderChips(); render();
}
function cycleLang(){ const next = LANGS[(LANGS.indexOf(lang()) + 1) % LANGS.length]; localStorage.setItem("stw-lang", next); applyLang(); }
function toggleTheme(){ const d = document.documentElement.dataset.theme === "dark"; document.documentElement.dataset.theme = d ? "" : "dark"; localStorage.setItem("stw-theme", d ? "light" : "dark"); }
(function(){ const s = localStorage.getItem("stw-theme"); if (s === "dark" || (!s && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark"; })();

// ── 状態 ──
let cat = "all";
const FAV_KEY = "stw_life_fav", OPEN_KEY = "stw_life_open";
function favs(){ try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch(e){ return new Set(); } }
function saveFavs(s){ localStorage.setItem(FAV_KEY, JSON.stringify([...s])); }
let openIds = new Set(); try { openIds = new Set(JSON.parse(sessionStorage.getItem(OPEN_KEY) || "[]")); } catch(e){}
function zy(py){ try { return (typeof py2zy === "function") ? py2zy(py) : ""; } catch(e){ return ""; } }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s, q){ if (!q) return esc(s); const i = s.toLowerCase().indexOf(q); if (i < 0) return esc(s); return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+q.length)) + "</mark>" + esc(s.slice(i+q.length)); }

function renderChips(){
  const f = favs();
  const chips = [{id:"all", label:t("all")}, {id:"fav", label:"♥ " + t("fav") + (f.size ? " " + f.size : "")}]
    .concat(LIFE.cats.map(c => ({id:c.id, label:c.icon + " " + tr(c.name)})));
  document.getElementById("chips").innerHTML = chips.map(c => `<button class="chip${cat===c.id?" on":""}" onclick="setCat('${c.id}')">${esc(c.label)}</button>`).join("");
}
function setCat(id){ cat = id; renderChips(); render(); window.scrollTo({top: Math.min(window.scrollY, 120)}); }

function matches(s, q){
  if (!q) return true;
  if (tr(s.name).toLowerCase().includes(q) || s.name.en.toLowerCase().includes(q) || s.name.ja.includes(q)) return true;
  return s.lines.some(l => l.z.includes(q) || l.py.replace(/\s/g,"").includes(q.replace(/\s/g,"")) || tr(l.m).toLowerCase().includes(q) || l.m.en.toLowerCase().includes(q) || l.m.ja.includes(q));
}
function render(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const f = favs();
  let rows = LIFE.scenes.filter(s => (cat === "all" || (cat === "fav" ? f.has(s.id) : s.cat === cat)) && matches(s, q));
  // お気に入りは常に先頭
  rows = rows.slice().sort((a, b) => (f.has(b.id) ? 1 : 0) - (f.has(a.id) ? 1 : 0));
  document.getElementById("count").textContent = t("count").replace("{n}", rows.length);
  const autoOpen = !!q || rows.length <= 2;
  document.getElementById("list").innerHTML = rows.length ? rows.map(s => {
    const open = autoOpen || openIds.has(s.id);
    return `<section class="scene${open?" open":""}" id="${s.id}" data-id="${s.id}">
      <div class="sc-hd" onclick="toggleScene('${s.id}')">
        <span class="ic">${s.icon}</span>
        <div class="nm">${hl(tr(s.name), q)}<small>${esc(LIFE.cats.find(c=>c.id===s.cat) ? tr(LIFE.cats.find(c=>c.id===s.cat).name) : "")} · ${s.lines.length}</small></div>
        <button class="fav${f.has(s.id)?" on":""}" onclick="event.stopPropagation();toggleFav('${s.id}')" aria-label="save">${f.has(s.id) ? "♥" : "♡"}</button>
        <span class="chev">⌄</span>
      </div>
      <div class="sc-body">
        <div class="sc-tools">
          <button class="pri" onclick="playAll('${s.id}')">▶ ${esc(t("play"))}</button>
          <button onclick="copyScene('${s.id}')">${esc(t("copy"))}</button>
        </div>
        ${s.lines.map((l, i) => `<div class="line ${l.w}" data-i="${i}" onclick="if(document.body.classList.contains('learn'))this.classList.toggle('show')">
          <div class="who">${esc(l.w === "t" ? t("them") : t("you"))}</div>
          <div class="txt">
            <div class="z" onclick="event.stopPropagation();say('${esc(l.z)}',this)">${hl(l.z, q)}</div>
            <div class="rd"><span>${esc(l.py)}</span><span class="zy">${esc(zy(l.py))}</span></div>
            <div class="tr">${hl(tr(l.m), q)}</div>
          </div>
          <div class="lact"><button onclick="event.stopPropagation();say('${esc(l.z)}',this)" aria-label="play">🔊</button></div>
        </div>`).join("")}
        <div class="tip"><b>${esc(t("tip"))}</b>${esc(tr(s.tip))}</div>
      </div>
    </section>`;
  }).join("") : `<div class="empty">${esc(t("empty"))}</div>`;
}
function toggleScene(id){
  const el = document.getElementById(id); if (!el) return;
  el.classList.toggle("open");
  if (el.classList.contains("open")) openIds.add(id); else openIds.delete(id);
  try { sessionStorage.setItem(OPEN_KEY, JSON.stringify([...openIds])); } catch(e){}
}
function toggleFav(id){ const f = favs(); f.has(id) ? f.delete(id) : f.add(id); saveFavs(f); renderChips(); render(); }
function toggleZy(){ document.body.classList.toggle("hidezy"); localStorage.setItem("stw_life_zy", document.body.classList.contains("hidezy") ? "0" : "1"); document.getElementById("zyBtn").classList.toggle("on", !document.body.classList.contains("hidezy")); }
function toggleLearn(){ const on = document.body.classList.toggle("learn"); document.getElementById("learnBtn").classList.toggle("on", on); document.querySelectorAll(".line.show").forEach(e => e.classList.remove("show")); if (on) toast(t("learnHint")); }

// ── 音声：事前生成 mp3 があれば TTS.speak が使う、無ければ端末の合成音声（zh-TW）──
let playingBtn = null, playToken = 0;
function mark(btn, on){ if (playingBtn) playingBtn.classList.remove("playing"); playingBtn = on ? btn : null; if (btn && on) btn.classList.add("playing"); }
function say(text, btn, onend){
  playToken++; const tok = playToken;
  mark(btn, true);
  const done = () => { if (tok === playToken) mark(btn, false); if (onend) onend(); };
  try {
    // 速度は TTS の全体設定（上の速度ボタン＝localStorage stw_tts_rate）にまかせる
    if (window.TTS && TTS.speak) { TTS.stop && TTS.stop(); TTS.speak(text, null, done); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; u.rate = speed(); u.onend = done; u.onerror = done;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){ done(); }
}
// ── 再生速度（サイト共通・localStorage stw_tts_rate で永続）──
const SPEEDS = [1, 0.75, 0.5, 1.25];
function speed(){ try { return (window.TTS && TTS.getRate) ? TTS.getRate() : (parseFloat(localStorage.getItem("stw_tts_rate")) || 1); } catch(e){ return 1; } }
function setSpeed(r){ try { if (window.TTS && TTS.setRate) TTS.setRate(r); else localStorage.setItem("stw_tts_rate", r); } catch(e){} refreshSpeed(); }
function refreshSpeed(){ const b = document.getElementById("spdBtn"); if (b) { const r = speed(); b.textContent = r + "x"; b.classList.toggle("on", r !== 1); } }
function cycleSpeed(){ const i = SPEEDS.indexOf(speed()); setSpeed(SPEEDS[(i + 1) % SPEEDS.length]); toast(t("speedNow").replace("{r}", speed())); }
// ゆっくり再生は Premium（App 内のみ制限。Web は Paywall が常に解放）
function playAll(id){
  const s = LIFE.scenes.find(x => x.id === id); if (!s) return;
  const els = document.querySelectorAll(`#${id} .line .lact button`);
  let i = 0;
  const next = () => { if (i >= s.lines.length) return; const btn = els[i]; const text = s.lines[i].z; i++; say(text, btn, () => setTimeout(next, 380)); };
  next();
}
async function copyScene(id){
  const s = LIFE.scenes.find(x => x.id === id); if (!s) return;
  const txt = tr(s.name) + "\n" + s.lines.map(l => (l.w === "t" ? "▷ " : "▶ ") + l.z + "\n   " + l.py + "\n   " + tr(l.m)).join("\n") + "\n\nStayTW https://staytw.pages.dev/life#" + id;
  try { await navigator.clipboard.writeText(txt); toast(t("copied")); } catch(e){ prompt("", txt); }
}
function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2000); }

// ── 起動 ──
(function(){
  const q = new URLSearchParams(location.search).get("lang"); if (q && T[q]) localStorage.setItem("stw-lang", q);
  if (localStorage.getItem("stw_life_zy") === "0") document.body.classList.add("hidezy"); else document.getElementById("zyBtn").classList.add("on");
  refreshSpeed();
  if (location.hash) { const id = location.hash.slice(1); if (LIFE.scenes.some(s => s.id === id)) { openIds.add(id); setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({block:"start"}); }, 50); } }
  applyLang();
})();
</script>
<script>try{fetch("/api/hit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:location.pathname+(function(){try{var u=new URLSearchParams(location.search).get("utm_source");return u?"?utm_source="+u.replace(/[^\w-]/g,"").slice(0,40):""}catch(e){return ""}})(),ref:document.referrer,app:!!(window.STAYTW_NATIVE&&window.STAYTW_NATIVE.isNativeApp)})})}catch(e){}</script>
