/* ===== 注音 ㄅㄆㄇ ===== */
const ZY = (() => {
  let mode = "table";
  const body = () => document.getElementById("zyBody");
  const GKEY = { initial:"zyGInitial", medial:"zyGMedial", final:"zyGFinal" };

  // 各符号の許容ローマ字（"i / yi" → i, yi ／ ü → u, v も許容）
  function accepts(z){
    const set = new Set();
    z.py.split(/[\s/]+/).filter(Boolean).forEach(p => {
      const t = p.toLowerCase();
      set.add(t); set.add(t.replace(/ü/g,"u")); set.add(t.replace(/ü/g,"v")); set.add(t.replace(/ê/g,"e"));
    });
    return set;
  }

  function render(){
    document.querySelectorAll(".zy-tab").forEach(t => t.classList.toggle("on", t.dataset.zy === mode));
    if (mode === "table") renderTable();
    else if (mode === "write") renderWrite();
    else startTest();
  }

  /* ── 書き方（なぞり書き練習）── */
  let wi = 0, wGuide = true;
  function renderWrite(){
    const z = ZHUYIN[wi];
    body().innerHTML = `<div class="zw">
      <p class="zy-hint">${twT("zyWriteHint")}</p>
      <div class="zw-info">
        <button class="tts-btn" onclick="ZY.play(null,'${z.z}','${z.rep}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button>
        <span class="zw-py">${z.py}</span>
      </div>
      <div class="zw-pad">
        <div class="zw-guide ${wGuide?"":"hide"}" id="zwGuide">${z.z}</div>
        <canvas class="zw-canvas" id="zwCanvas" width="600" height="600"></canvas>
      </div>
      <div class="zw-ctrls">
        <button class="zy-tab" onclick="ZY.wGuide()" id="zwGuideBtn">${wGuide?twT("zwGuideOn"):twT("zwGuideOff")}</button>
        <button class="zy-tab" onclick="ZY.wClear()">${twT("zwClear")}</button>
      </div>
      <div class="zw-nav">
        <button onclick="ZY.wMove(-1)">←</button>
        <span class="zw-prog">${z.z}　${wi+1} / ${ZHUYIN.length}</span>
        <button onclick="ZY.wMove(1)">→</button>
      </div>
    </div>`;
    initCanvas();
  }
  let ctx = null, drawing = false;
  function initCanvas(){
    const c = document.getElementById("zwCanvas"); if (!c) return;
    ctx = c.getContext("2d");
    const cs = getComputedStyle(document.documentElement);
    ctx.lineWidth = 22; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = (cs.getPropertyValue("--ac") || "#B8362A").trim();
    const pos = e => {
      const r = c.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) / r.width * c.width, y: (t.clientY - r.top) / r.height * c.height };
    };
    const start = e => { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const end = () => { drawing = false; };
    c.addEventListener("mousedown", start); c.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    c.addEventListener("touchstart", start, {passive:false}); c.addEventListener("touchmove", move, {passive:false});
    c.addEventListener("touchend", end);
  }
  function wClear(){ const c = document.getElementById("zwCanvas"); if (c && ctx) ctx.clearRect(0,0,c.width,c.height); }
  function wGuideToggle(){ wGuide = !wGuide; renderWrite(); }
  function wMove(d){ wi = (wi + d + ZHUYIN.length) % ZHUYIN.length; renderWrite(); }
  function renderTable(){
    let html = `<details class="zy-py-info"><summary>${twT("zyPyToggle")}</summary><div class="zy-py-body">${twT("zyPyBody")}</div></details>`;
    html += `<p class="zy-hint">${twT("zyHint")}</p>`;
    for (const g of ["initial","medial","final"]){
      const items = ZHUYIN.filter(z => z.g === g);
      html += `<div class="zy-group"><h4>${twT(GKEY[g])}</h4><div class="zy-grid">` +
        items.map(z => `<button class="zy-cell" onclick="ZY.play(this,'${z.z}','${z.rep}')"><div class="zy-z">${z.z}</div><div class="zy-py">${z.py}</div></button>`).join("") +
        `</div></div>`;
    }
    html += `<p class="zy-credit">${twT("zyCredit")} <a href="https://creativecommons.org/licenses/by/4.0/deed.zh_TW" target="_blank" rel="noopener">CC BY 4.0</a></p>`;
    body().innerHTML = html;
  }
  function play(el, sym, rep){
    document.querySelectorAll(".zy-cell.play").forEach(c => c.classList.remove("play"));
    if (el){ el.classList.add("play"); setTimeout(() => el.classList.remove("play"), 700); }
    TTS.speakKey(sym, rep);   // 符号キーの専用音声（呼読音・一声）。無ければ rep を読む
  }

  // ── テスト（打ち／聴き）──
  let queue = [], qi = 0, correct = 0, locked = false;
  const TOTAL = 15;
  function startTest(){
    // 注音は初学者の土台なので全部無料（テストも）。豊かな無料コンテンツで信頼を、課金価値は深い TOCFL 本編に。
    queue = [...ZHUYIN].sort(() => Math.random()-.5).slice(0, TOTAL);
    qi = 0; correct = 0;
    mode === "type" ? renderType() : renderListen();
  }
  const cur = () => queue[qi];
  const progress = () => `<div class="zy-prog">${qi+1} / ${TOTAL}　✓ ${correct}</div>`;

  function renderType(){
    locked = false;
    const z = cur();
    body().innerHTML = `<div class="zy-test">
      <p class="zy-hint">${twT("zyTypeHint")}</p>
      <div class="zy-prompt">${z.z}</div>
      <button class="zy-play-btn" onclick="ZY.play(null,'${z.z}','${z.rep}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg> ${twT("btnPlay")}</button>
      <div><input class="zy-input" id="zyIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${twT("zyTypePh")}"></div>
      <div class="zy-fb" id="zyFb"></div>
      <div style="margin-top:10px"><button class="btn primary" id="zyGo" onclick="ZY.submitType()">${twT("qzSubmit")}</button></div>
      ${progress()}</div>`;
    const inp = document.getElementById("zyIn");
    inp.focus();
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submitType(); });
    play(null, z.z, z.rep);
  }
  function submitType(){
    if (locked){ next(); return; }
    const z = cur(), val = (document.getElementById("zyIn").value || "").trim().toLowerCase().replace(/ü/g,"u");
    const ok = accepts(z).has(val) || accepts(z).has(val.replace(/v/g,"u"));
    const fb = document.getElementById("zyFb");
    if (ok){ correct++; fb.className = "zy-fb ok"; fb.textContent = "✓ " + z.z + " = " + z.py; }
    else { fb.className = "zy-fb ng"; fb.textContent = "✗ " + z.z + " = " + z.py; }
    document.getElementById("zyIn").disabled = true;
    document.getElementById("zyGo").textContent = twT("quizNext");
    locked = true;
  }

  function renderListen(){
    locked = false;
    const z = cur();
    const opts = [z, ...ZHUYIN.filter(x => x.z !== z.z).sort(() => Math.random()-.5).slice(0,3)].sort(() => Math.random()-.5);
    body().innerHTML = `<div class="zy-test">
      <p class="zy-hint">${twT("zyListenHint")}</p>
      <button class="zy-play-btn" onclick="ZY.play(null,'${z.z}','${z.rep}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg> ${twT("btnPlay")}</button>
      <div class="zy-opts">${opts.map(o => `<button class="zy-opt" data-z="${o.z}" onclick="ZY.pick(this,'${o.z}','${z.z}')">${o.z}</button>`).join("")}</div>
      <div class="zy-fb" id="zyFb"></div>
      ${progress()}</div>`;
    play(null, z.z, z.rep);
  }
  function pick(el, picked, answer){
    if (locked) return;
    locked = true;
    const z = cur();
    const ok = picked === answer;
    if (ok) correct++;
    el.classList.add(ok ? "ok" : "ng");
    if (!ok) document.querySelectorAll(".zy-opt").forEach(o => { if (o.dataset.z === answer) o.classList.add("ok"); });
    const fb = document.getElementById("zyFb");
    fb.className = "zy-fb " + (ok ? "ok" : "ng");
    fb.textContent = (ok ? "✓ " : "✗ ") + z.z + " = " + z.py;
    setTimeout(next, 1100);
  }

  function next(){
    qi++;
    if (qi >= TOTAL){ result(); return; }
    mode === "type" ? renderType() : renderListen();
  }
  function result(){
    body().innerHTML = `<div class="zy-test">
      <div style="font-family:var(--serif);font-size:34px;color:var(--ac);font-weight:700">${correct >= 12 ? twT("zyResGreat") : correct >= 8 ? twT("zyResGood") : twT("zyResTry")}</div>
      <h3 style="font-family:var(--serif);font-size:24px;margin:10px 0">${correct} / ${TOTAL}</h3>
      <div style="margin-top:18px"><button class="btn primary" onclick="ZY.again()">${twT("quizRetry")}</button></div></div>`;
  }
  function again(){ startTest(); }

  document.querySelectorAll(".zy-tab").forEach(t => t.onclick = () => { mode = t.dataset.zy; render(); });

  return { render, play, submitType, pick, again, wClear, wGuide: wGuideToggle, wMove };
})();

/* 読み物データはファイル毎に const 宣言（window に載らない）ので名前で引く */
function twReading(level){
  switch(level){
    case "l1": return typeof READING_L1!=="undefined"?READING_L1:[];
    case "l2": return typeof READING_L2!=="undefined"?READING_L2:[];
    case "l3": return typeof READING_L3!=="undefined"?READING_L3:[];
    case "l4": return typeof READING_L4!=="undefined"?READING_L4:[];
    case "l5": return typeof READING_L5!=="undefined"?READING_L5:[];
  }
  return [];
}
/* ===== 学習パス（TOCFL 主線）：現有ツールを一本の道に。今のレベルの進み具合と「次にやること」 ===== */
const PA = (() => {
  const parse = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };

  function stages(){
    const lv = currentLevel;
    const vocabTotal = (typeof getVocabData === "function" ? getVocabData(lv).length : 0) || 0;
    const st = (typeof SRS !== "undefined" && SRS.getStats) ? SRS.getStats(lv) : { total:0, due:0, mastered:0, learning:0 };
    const stories = twReading(lv);
    const readIds = parse("stw_read", []);
    const readCount = stories.filter(s => readIds.includes(s.id)).length;
    const exam = parse("stw_exam_history", []);
    const best = exam.length ? Math.max(...exam.map(h => Math.round(h.score / h.total * 100))) : 0;
    const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
    return [
      { key:"fc",      icon:"1", cur:st.mastered, tot:vocabTotal, pct:pct(st.mastered, vocabTotal),
        done: vocabTotal>0 && st.mastered >= Math.max(1, Math.round(vocabTotal*0.8)),
        started: st.total>0, frac:`${st.mastered} / ${vocabTotal}` },
      { key:"quiz",    icon:"2", cur:st.total, tot:vocabTotal, pct:pct(st.total, vocabTotal),
        done: vocabTotal>0 && st.total >= vocabTotal, started: st.total>0, frac:`${st.total} / ${vocabTotal}` },
      { key:"reading", icon:"3", cur:readCount, tot:stories.length, pct:pct(readCount, stories.length),
        done: stories.length>0 && readCount >= stories.length, started: readCount>0,
        frac: stories.length ? `${readCount} / ${stories.length}` : "—" },
      { key:"srs",     icon:"4", cur:st.total-st.due, tot:st.total, pct: st.total? pct(st.total-st.due, st.total):0,
        done: st.total>0 && st.due===0, started: st.total>0, frac: st.due ? twT("paDue").replace("{n}", st.due) : (st.total?twT("paClear"):"—") },
      { key:"exam",    icon:"5", cur:best, tot:100, pct:best,
        done: best>=60, started: exam.length>0, frac: best?`${best}%`:"—" },
    ];
  }

  function render(){
    const lvName = { l1:twT("lv_l1"), l2:twT("lv_l2"), l3:twT("lv_l3"), l4:twT("lv_l4"), l5:twT("lv_l5") }[currentLevel] || "";
    const s = stages();
    const next = s.find(x => !x.done) || s[s.length-1];
    const daily = (typeof getDaily === "function") ? getDaily() : { n:0, goal:20, pct:0, done:false };
    const streak = (typeof getStreak === "function") ? getStreak() : { cur:0 };
    const rows = s.map((x,i) => {
      const status = x.done ? "done" : (x.started ? "doing" : "todo");
      const badge = x.done ? "✓" : x.icon;
      return `<button class="pa-step ${status} ${x.key===next.key?"next":""}" onclick="switchPanel('${x.key}')">
        <div class="pa-num">${badge}</div>
        <div class="pa-main">
          <div class="pa-t">${twT("paStep_"+x.key)}${x.key===next.key?` <span class="pa-next-tag">${twT("paNext")}</span>`:""}</div>
          <div class="pa-d">${twT("paDesc_"+x.key)}</div>
          <div class="pa-bar"><i style="width:${x.pct}%"></i></div>
        </div>
        <div class="pa-frac">${x.frac}</div>
      </button>`;
    }).join("");
    document.getElementById("paBody").innerHTML = `
      <div class="pa-head">
        <div><div class="pa-lv">TOCFL ${lvName}</div><p class="pa-lead">${twT("paLead")}</p></div>
      </div>
      <div class="pa-mini">
        <div class="pa-mini-i"><b>${streak.cur}</b><span>${twT("pfStreak")}</span></div>
        <div class="pa-mini-i ${daily.done?"ok":""}"><b>${daily.n}/${daily.goal}</b><span>${twT("pfDaily")}</span></div>
      </div>
      <div class="pa-found-h">${twT("paFoundH")}</div>
      <button class="pa-found" onclick="switchPanel('zhuyin')">
        <div class="pa-found-ic">ㄅ</div>
        <div class="pa-found-tx"><div class="pa-found-t">${twT("paFoundT")}</div><div class="pa-found-d">${twT("paFoundD")}</div></div>
        <svg viewBox="0 0 24 24" class="pa-found-ch"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="pa-found-h">${twT("paLevelH").replace("{lv}", lvName)}</div>
      <div class="pa-steps">${rows}</div>`;
  }
  return { render };
})();

/* ===== 共用：本文中の生詞をタップ可能にする＋タップ辞書シート（読解・記事で共用） ===== */
function twMarkupVocab(z, vocab){
  if (!vocab || !vocab.length) return z;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const ws = [...vocab].map(v=>v.w).filter(Boolean).sort((a,b)=>b.length-a.length);
  let re; try { re = new RegExp("(" + ws.map(esc).join("|") + ")", "g"); } catch(e){ return z; }
  return z.replace(re, m => `<span class="ar-w" data-w="${m}">${m}</span>`);
}
function twBindWords(container, vocab){
  container.querySelectorAll(".ar-w").forEach(el => el.onclick = e => { e.stopPropagation(); twWord(vocab, el.dataset.w); });
}
function twWord(vocab, w){
  const v = (vocab || []).find(x => x.w === w); if (!v) return;
  const mk = twMKey();
  document.getElementById("wsBox").innerHTML = `
    <div class="ws-top"><div class="ws-w">${v.w}</div><button class="ws-play" onclick="speakZh('${v.w}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button></div>
    <div class="ws-p">${v.zy}　${v.py}</div>
    <div class="ws-m">${v.m[mk] || v.m.j}</div>`;
  document.getElementById("wsBg").classList.add("show");
  document.getElementById("wsBox").classList.add("show");
  speakZh(v.w);
}
function twCloseWord(){ const bg=document.getElementById("wsBg"), bx=document.getElementById("wsBox"); if(bg)bg.classList.remove("show"); if(bx)bx.classList.remove("show"); }

/* ===== 分級閲読（読解）：台湾のリアルな短文＋逐句音声＋生詞＋理解チェック ===== */
const RD = (() => {
  const DATA = ["l1","l2","l3","l4","l5"].reduce((o,l)=>{ o[l] = twReading(l); return o; }, {});
  let showPy = false, showTr = false, cur = null;
  let rdFont = Math.min(28, Math.max(17, +(localStorage.getItem("stw_rd_font") || 21)));
  const box = () => document.getElementById("rdBox");
  const list = () => DATA[currentLevel] || [];

  function render(){ cur = null; stopRead(); twCloseWord(); renderList(); }

  function renderList(){
    const mk = twMKey(), items = list();
    if (!items.length){
      box().innerHTML = `<p class="rd-empty">${twT("rdComing")}</p>`; return;
    }
    box().innerHTML = `<p class="rd-lead">${twT("rdLead")}</p>` + items.map((s,i)=>{
      const done = readDone(s.id);
      return `<button class="rd-card" onclick="RD.open(${i})">
        <div class="rd-card-t">${s.title[mk] || s.title.j}</div>
        <div class="rd-card-meta">${s.lines.length} ${twT("rdSentences")}${done ? ` ・ <span class="rd-ok">${twT("rdRead")}</span>` : ""}</div>
      </button>`;
    }).join("");
  }

  function open(i){
    cur = list()[i]; if (!cur) return;
    showTr = false;
    renderStory();
    window.scrollTo({top:0});
  }

  function renderStory(){
    const mk = twMKey(), s = cur;
    const lines = s.lines.map((ln,idx)=>`
      <div class="rd-line" data-idx="${idx}">
        <div class="rd-z">${twMarkupVocab(ln.z, s.vocab)}</div>
        <div class="rd-py" style="${showPy?"":"display:none"}">${ln.py}</div>
        <div class="rd-tr" style="${showTr?"":"display:none"}">${ln.m[mk] || ln.m.j}</div>
        <button class="ar-para-play" onclick="RD.line(${idx})" aria-label="play"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button>
      </div>`).join("");
    const vocab = s.vocab.map(v=>`
      <div class="rd-voc" onclick="speakZh('${v.w}')">
        <span class="rd-voc-w">${v.w}</span>
        <span class="rd-voc-p">${v.zy} ｜ ${v.py}</span>
        <span class="rd-voc-m">${v.m[mk] || v.m.j}</span>
      </div>`).join("");
    box().innerHTML = `
      <div class="ar-top">
        <button class="ar-back" onclick="RD.render()"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="ar-fontctl"><button onclick="RD.font(-1)">A<small>−</small></button><button onclick="RD.font(1)">A<small>＋</small></button></div>
      </div>
      <h3 class="rd-title">${s.title[mk] || s.title.j}</h3>
      <div class="ar-tips">${twT("arTapHint")}</div>
      <div class="rd-toggles">
        <button class="rd-tg ${showPy?"on":""}" onclick="RD.togglePy()">${twT("rdPinyin")}</button>
        <button class="rd-tg ${showTr?"on":""}" onclick="RD.toggleTr()">${twT("rdTrans")}</button>
        <button class="rd-tg" id="rdPlayBtn" onclick="RD.playAll()">▶ ${twT("rdPlayAll")}</button>
      </div>
      <div class="rd-story" style="font-size:${rdFont}px">${lines}</div>
      <h4 class="rd-h4">${twT("rdVocab")}</h4>
      <div class="rd-vocs">${vocab}</div>
      <div id="rdQ"></div>`;
    twBindWords(box(), s.vocab);
    renderQ();
  }
  function font(d){ rdFont = Math.min(28, Math.max(17, rdFont + d*2)); localStorage.setItem("stw_rd_font", rdFont); const el = box().querySelector(".rd-story"); if (el) el.style.fontSize = rdFont + "px"; }

  function line(idx){
    stopRead();
    const ln = cur.lines[idx];
    speakZh(ln.z);
    // タップした行の訳をその場で表示（読解しながら答え合わせ）
    const el = box().querySelector(`.rd-line[data-idx="${idx}"] .rd-tr`);
    if (el) el.style.display = "";
  }
  function togglePy(){ showPy = !showPy; renderStory(); }
  function toggleTr(){ showTr = !showTr; renderStory(); }
  let rdPlaying = false, rdPlayIdx = -1;
  function playAll(){
    if (rdPlaying){ stopRead(); return; }
    rdPlaying = true; rdPlayIdx = 0; setPlayBtn(); readStep();
  }
  // 各行を最後まで読んでから次へ（ended で送り。時計送りで途中で切れる・カクつく問題を解消）
  function readStep(){
    if (!rdPlaying || !cur || rdPlayIdx >= cur.lines.length){ stopRead(); return; }
    box().querySelectorAll(".rd-line.playing").forEach(e=>e.classList.remove("playing"));
    const el = box().querySelector(`.rd-line[data-idx="${rdPlayIdx}"]`);
    if (el){ el.classList.add("playing"); el.scrollIntoView({block:"center",behavior:"smooth"}); if (showTr){ const tr = el.querySelector(".rd-tr"); if (tr) tr.style.display=""; } }
    speakZh(cur.lines[rdPlayIdx].z, 1, () => { if (!rdPlaying) return; rdPlayIdx++; setTimeout(readStep, 350); });
  }
  function stopRead(){ rdPlaying = false; rdPlayIdx = -1; if (window.TTS && TTS.stop) TTS.stop(); const b = box(); if (b) b.querySelectorAll(".rd-line.playing").forEach(e=>e.classList.remove("playing")); setPlayBtn(); }
  function setPlayBtn(){ const b = document.getElementById("rdPlayBtn"); if (b) b.textContent = (rdPlaying ? "⏸ " : "▶ ") + twT("rdPlayAll"); }

  function renderQ(){
    const mk = twMKey(), q = cur.q; if (!q) return;
    document.getElementById("rdQ").innerHTML = `
      <h4 class="rd-h4">${twT("rdCheck")}</h4>
      <div class="rd-q">${q.ask[mk] || q.ask.j}</div>
      <div class="rd-opts">${q.opts.map((o,i)=>`<button class="rd-opt" data-i="${i}" onclick="RD.answer(${i})">${o[mk] || o.j}</button>`).join("")}</div>
      <div class="rd-why" id="rdWhy"></div>`;
  }
  function answer(i){
    const mk = twMKey(), q = cur.q, ok = i === q.ans;
    box().querySelectorAll(".rd-opt").forEach((b,idx)=>{ b.disabled = true; if (idx===q.ans) b.classList.add("ok"); });
    if (!ok) box().querySelectorAll(".rd-opt")[i].classList.add("ng");
    const why = document.getElementById("rdWhy");
    why.className = "rd-why " + (ok?"ok":"ng");
    why.innerHTML = `<b>${ok?"⭕":"❌"}</b> ${q.why[mk] || q.why.j}`;
    markRead(cur.id);
    recordStudy();   // ストリーク＋今日の学習数
  }

  // 読了記録
  function readDone(id){ try { return (JSON.parse(localStorage.getItem("stw_read")||"[]")).includes(id); } catch(e){ return false; } }
  function markRead(id){
    let a; try{ a = JSON.parse(localStorage.getItem("stw_read")||"[]"); }catch(e){ a=[]; }
    if (!a.includes(id)){ a.push(id); localStorage.setItem("stw_read", JSON.stringify(a)); if (typeof window.onSRSChange==="function") window.onSRSChange(); }
  }

  return { render, open, line, togglePy, toggleTr, playAll, answer, font, stopRead };
})();

/* ===== 記事（コラム）：台湾のリアルを深掘りする長文リーディング ===== */
function twArticles(){
  return [
    (typeof ARTICLES_1 !== "undefined" ? ARTICLES_1 : []),
    (typeof ARTICLES_2 !== "undefined" ? ARTICLES_2 : []),
    (typeof ARTICLES_3 !== "undefined" ? ARTICLES_3 : []),
    (typeof ARTICLES_4 !== "undefined" ? ARTICLES_4 : []),
    (typeof ARTICLES_5 !== "undefined" ? ARTICLES_5 : []),
    (typeof ARTICLES_6 !== "undefined" ? ARTICLES_6 : []),
    (typeof ARTICLES_7 !== "undefined" ? ARTICLES_7 : []),
    (typeof ARTICLES_8 !== "undefined" ? ARTICLES_8 : []),
    (typeof ARTICLES_9 !== "undefined" ? ARTICLES_9 : []),
    (typeof ARTICLES_10 !== "undefined" ? ARTICLES_10 : []),
    (typeof ARTICLES_11 !== "undefined" ? ARTICLES_11 : []),
    (typeof ARTICLES_12 !== "undefined" ? ARTICLES_12 : []),
    (typeof ARTICLES_13 !== "undefined" ? ARTICLES_13 : []),
    (typeof ARTICLES_14 !== "undefined" ? ARTICLES_14 : []),
    (typeof ARTICLES_15 !== "undefined" ? ARTICLES_15 : []),
  ].flat();
}
const AR = (() => {
  let showPy = false, showTr = false, cur = null;
  let arFont = Math.min(26, Math.max(15, +(localStorage.getItem("stw_ar_font") || 19)));
  const RATES = [1, 0.8, 1.2]; let rateIdx = 0;
  let playing = false, playIdx = -1;
  const box = () => document.getElementById("arBox");
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const parse = (k,d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; } catch(e){ return d; } };

  function render(){ cur = null; hideBar(); closeWord(); renderList(); }
  function locked(i){ return i !== 0 && !Paywall.isPremium(); }   // 最初の1本は無料、以降はプレミアム
  let arFilter = "all", arCats = [];
  function renderList(){
    const mk = twMKey(), items = twArticles();
    if (!items.length){ box().innerHTML = `<p class="rd-empty">${twT("arComing")}</p>`; return; }
    arCats = [...new Set(items.map(a => a.cat.e))];
    const chips = `<div class="ar-filter"><button class="ar-fc ${arFilter==="all"?"on":""}" onclick="AR.filter(-1)">${twT("arAll")}</button>` +
      arCats.map((c,ci)=>{ const lab = (items.find(a=>a.cat.e===c).cat[mk]) || c; return `<button class="ar-fc ${arFilter===c?"on":""}" onclick="AR.filter(${ci})">${lab}</button>`; }).join("") + `</div>`;
    const cards = items.map((a,i)=>({a,i})).filter(x => arFilter==="all" || x.a.cat.e===arFilter).map(({a,i})=>{
      const lk = locked(i);
      const tag = lk ? `<span class="ar-lock">🔒 ${twT("arLocked")}</span>` : (i===0 ? `<span class="ar-freetag">${twT("arFree")}</span>` : "");
      const prev = (a.paras && a.paras[0] ? a.paras[0].z : "").slice(0, 46);
      return `<button class="ar-card ${lk?"locked":""}" onclick="AR.open(${i})">
        <div class="ar-card-cat">${a.cat[mk] || a.cat.j}${readDone(a.id) ? ` ・ <span class="rd-ok">${twT("rdRead")}</span>` : ""} ${tag}</div>
        <div class="ar-card-zh">${a.zhTitle}</div>
        <div class="ar-card-t">${a.title[mk] || a.title.j}</div>
        <div class="ar-card-prev">${prev}…</div>
      </button>`;
    }).join("");
    box().innerHTML = `<p class="rd-lead">${twT("arLead")}</p>` + chips + cards;
  }
  function filter(ci){ arFilter = ci < 0 ? "all" : arCats[ci]; renderList(); }
  function open(i){
    if (locked(i)) { Paywall.show("article"); return; }   // 有料記事はペイウォールへ
    cur = twArticles()[i]; if (!cur) return; showTr = false; renderArticle(); window.scrollTo({top:0});
  }

  function renderArticle(){
    const mk = twMKey(), a = cur;
    const paras = a.paras.map((p,idx)=>`
      <div class="ar-para" data-idx="${idx}">
        <div class="ar-z">${twMarkupVocab(p.z, a.vocab)}</div>
        <div class="ar-py" style="${showPy?"":"display:none"}">${p.py}</div>
        <div class="ar-tr" style="${showTr?"":"display:none"}">${p.m[mk] || p.m.j}</div>
        <button class="ar-para-play" onclick="AR.para(${idx})" aria-label="play"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button>
      </div>`).join("");
    const vocab = a.vocab.map(v=>`
      <div class="rd-voc" onclick="speakZh('${v.w}')">
        <span class="rd-voc-w">${v.w}</span><span class="rd-voc-p">${v.zy} ｜ ${v.py}</span>
        <span class="rd-voc-m">${v.m[mk] || v.m.j}</span></div>`).join("");
    box().innerHTML = `
      <div class="ar-top">
        <button class="ar-back" onclick="AR.render()"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="ar-fontctl"><button onclick="AR.font(-1)">A<small>−</small></button><button onclick="AR.font(1)">A<small>＋</small></button></div>
      </div>
      <div class="ar-cat">${a.cat[mk] || a.cat.j}</div>
      <h3 class="ar-zhtitle">${a.zhTitle}</h3>
      <div class="ar-title">${a.title[mk] || a.title.j}</div>
      <p class="ar-intro">${a.intro[mk] || a.intro.j}</p>
      <div class="ar-tips">${twT("arTapHint")}</div>
      <div class="ar-body" style="font-size:${arFont}px">${paras}</div>
      <h4 class="rd-h4">${twT("rdVocab")}</h4>
      <div class="rd-vocs">${vocab}</div>
      <div class="ar-note" style="font-size:${Math.max(14,arFont-4)}px"><div class="ar-note-h">${twT("arNote")}</div>${a.note[mk] || a.note.j}</div>
      <div style="height:78px"></div>`;
    renderBar();
    twBindWords(box(), a.vocab);
    markRead(a.id);
    if (typeof recordStudy === "function") recordStudy();
  }
  // 置底のツールバー（拼音・訳・再生・速度）
  function renderBar(){
    let bar = document.getElementById("arBar");
    if (!bar) { bar = document.createElement("div"); bar.id = "arBar"; bar.className = "ar-bar"; document.body.appendChild(bar); }
    bar.innerHTML = `
      <button class="ar-bt ${showPy?"on":""}" onclick="AR.togglePy()">拼音</button>
      <button class="ar-bt ${showTr?"on":""}" onclick="AR.toggleTr()">${twT("rdTrans")}</button>
      <button class="ar-bt play" onclick="AR.playAll()">${playing ? "⏸" : "▶"}</button>
      <button class="ar-bt" onclick="AR.speed()">${RATES[rateIdx]}x</button>`;
    bar.classList.add("show");
  }
  function hideBar(){ stopPlay(); const b = document.getElementById("arBar"); if (b) b.classList.remove("show"); }

  function para(idx){
    if (!cur) return;
    stopPlay();
    const p = cur.paras[idx]; speakZh(p.z, RATES[rateIdx]);
    const el = box().querySelector(`.ar-para[data-idx="${idx}"] .ar-tr`); if (el) el.style.display = "";
  }
  function togglePy(){ if (!cur) return; showPy = !showPy; renderArticle(); }
  function toggleTr(){ if (!cur) return; showTr = !showTr; renderArticle(); }
  function font(d){ if (!cur) return; arFont = Math.min(26, Math.max(15, arFont + d*2)); localStorage.setItem("stw_ar_font", arFont); const b = box().querySelector(".ar-body"); if (b) b.style.fontSize = arFont + "px"; }
  function speed(){ if (!cur) return; rateIdx = (rateIdx + 1) % RATES.length; renderBar(); }

  // 再生停止：バーは消さず、再生ボタンの表示だけ元に戻す
  function stopPlay(){
    playing = false;
    if (window.TTS && TTS.stop) TTS.stop();
    const el = box() && box().querySelector(".ar-para.playing"); if (el) el.classList.remove("playing");
    playIdx = -1;
    const pb = document.querySelector("#arBar .ar-bt.play"); if (pb) pb.textContent = "▶";
  }
  function playAll(){
    if (!cur) return;
    if (playing){ stopPlay(); return; }
    playing = true; playIdx = 0; renderBar(); step();
  }
  // その段落を最後まで読んでから（ended イベント）次へ。時計で送らない＝途中で切れない・カクつかない
  function step(){
    if (!playing || !cur || playIdx >= cur.paras.length){ stopPlay(); return; }
    box().querySelectorAll(".ar-para.playing").forEach(e=>e.classList.remove("playing"));
    const pEl = box().querySelector(`.ar-para[data-idx="${playIdx}"]`);
    if (pEl){ pEl.classList.add("playing"); pEl.scrollIntoView({block:"center",behavior:"smooth"}); const tr = pEl.querySelector(".ar-tr"); if (showTr && tr) tr.style.display=""; }
    speakZh(cur.paras[playIdx].z, RATES[rateIdx], () => { if (!playing) return; playIdx++; setTimeout(step, 350); });
  }

  const closeWord = twCloseWord;

  function readDone(id){ return parse("stw_art_read", []).includes(id); }
  function markRead(id){ let a=parse("stw_art_read",[]); if(!a.includes(id)){ a.push(id); localStorage.setItem("stw_art_read",JSON.stringify(a)); if(typeof window.onSRSChange==="function")window.onSRSChange(); } }

  return { render, open, para, togglePy, toggleTr, playAll, filter, font, speed, closeWord, hideBar, stopPlay };
})();
