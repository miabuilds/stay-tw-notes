<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>台湾華語スタディ StayTW Study — 学習ツール｜単語・文法・フレーズ・クイズ・復習・模試</title>
<meta name="description" content="台湾華語（繁体字中国語）の無料学習ツール。TOCFL Level 1〜5 の単語カード・文法・場面別フレーズ・クイズ・SRS復習・模擬試験。注音＋拼音つき、日本語・英語・韓国語対応。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/bear.svg">
<style>
/* ======================================================
   台湾華語スタディ StayTW Study — 学習ツール
   （版面は StayJP Study と同じ「和紙＋朱印」系デザイン）
   ====================================================== */
:root {
  --bg: #FAF8F3; --bg2: #FFFFFF; --bg3: #F2EEE5; --hd: #FAF8F3;
  --tx: #1C1C1E; --tx2: #6A6A6A; --tx-s: #A9A9A9; --tx3: #A9A9A9;
  --ac: #B8362A; --ac-soft: rgba(184,54,42,.08); --ac2: #2F5D7A;
  --ok: #2F7A5D;
  --bd: #E5DECF; --line: #DDD5C0;
  --sh: 0 1px 3px rgba(0,0,0,.03); --sh2: 0 2px 8px rgba(0,0,0,.04);
  --r: 10px; --hh: 56px; --ease: cubic-bezier(.25,.1,.25,1);
  --serif: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", "游明朝", "Songti TC", serif;
}
[data-theme="dark"] {
  --bg: #121113; --bg2: #1B1A1C; --bg3: #1F1E20; --hd: #121113;
  --tx: #EDE8DE; --tx2: #8F8A7E; --tx-s: #5D5A53; --tx3: #5D5A53;
  --ac: #E4715F; --ac-soft: rgba(228,113,95,.1); --ac2: #7FA5C2;
  --ok: #4C9B7A;
  --bd: #2C2A27; --line: #2C2A27; --sh: none; --sh2: none;
}
*{margin:0;padding:0;box-sizing:border-box;transition:color .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
html,body{overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang TC",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.7;font-size:16px;letter-spacing:.01em;-webkit-font-smoothing:antialiased;
}
a{color:var(--ac2);text-decoration:none}
button{font-family:inherit}

/* == Header == */
.hd{position:fixed;top:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:100;border-bottom:1px solid var(--line);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);padding-top:env(safe-area-inset-top)}
.hd-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;padding:0 24px;height:var(--hh);gap:10px}
.hd h1{color:var(--tx);font-size:15px;font-weight:700;white-space:nowrap;letter-spacing:.02em;font-family:var(--serif);display:flex;align-items:center;gap:8px}
.hd h1 a{color:inherit;display:flex;align-items:center;gap:8px}
.hd h1 img{width:26px;height:30px}
.hd-links{display:flex;gap:12px;margin-left:auto;align-items:center}
.hd-links a{color:var(--tx2);font-size:13px;font-weight:500;white-space:nowrap}
@media(hover:hover){.hd-links a:hover{color:var(--tx)}}
.lang-btn{background:var(--bg3);border:1px solid var(--bd);cursor:pointer;color:var(--tx2);padding:2px 10px;font-size:12px;font-weight:600;border-radius:8px;white-space:nowrap}
@media(hover:hover){.lang-btn:hover{color:var(--ac);border-color:var(--ac)}}
.theme-btn{background:none;border:none;cursor:pointer;color:var(--tx3);padding:6px;border-radius:10px;display:flex;align-items:center}
@media(hover:hover){.theme-btn:hover{color:var(--tx);background:var(--bg3)}}
.theme-btn svg{width:18px;height:18px}

/* == Layout == */
.wrap{max-width:1000px;margin:0 auto;padding:calc(var(--hh) + env(safe-area-inset-top) + 28px) 24px 80px}

/* == Level tabs & voice == */
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.levels .lv-label{font-size:12px;letter-spacing:.18em;color:var(--ac);font-weight:700;margin-right:4px}
.lv-btn{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:14px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;line-height:1.25}
.lv-btn small{display:block;font-size:10px;font-weight:500;color:var(--tx3);letter-spacing:.06em}
.lv-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lv-btn.on small{color:rgba(255,255,255,.75)}
.voice-sel{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3)}
.voice-sel select{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:8px;padding:4px 8px;font-size:12px;max-width:200px;font-family:inherit}

/* == Tool tabs == */
.tools{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto}
.tool-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--tx2);padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative}
.tool-btn.on{color:var(--ac);border-bottom-color:var(--ac)}
.tool-btn .badge{background:var(--ac);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;margin-left:5px;display:inline-block;min-width:18px;text-align:center}
.tool-btn .ti{margin-right:3px}
.panel{display:none}
.panel.on{display:block}

/* == はじめての流れ（初回のみ表示） == */
.ob-strip{display:flex;align-items:center;gap:12px;background:var(--ac-soft);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--bd));border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;color:var(--tx);line-height:1.7}
.ob-strip button{margin-left:auto;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:12px;white-space:nowrap;padding:4px}
@media(hover:hover){.ob-strip button:hover{color:var(--ac)}}

/* == トースト（評価したときのフィードバック） == */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* == キーボードヒント（デスクトップのみ） == */
.kbd-hint{text-align:center;font-size:11.5px;color:var(--tx-s);margin-top:14px}
@media(hover:none),(max-width:700px){.kbd-hint{display:none}}

/* == Flashcard == */
.fc-hint{text-align:center;font-size:13px;color:var(--tx3);margin-bottom:14px}
.fc{max-width:500px;margin:0 auto;perspective:1200px;cursor:pointer}
.fc-inner{position:relative;width:100%;min-height:360px;transform-style:preserve-3d;transition:transform .5s var(--ease)}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-word{font-family:var(--serif);font-size:clamp(44px,9vw,64px);font-weight:700;line-height:1.2}
.fc-zy{font-size:15px;color:var(--ac);margin-top:10px;letter-spacing:.12em}
.fc-py{font-size:17px;color:var(--tx2);margin-top:2px}
.fc-pos{display:inline-block;font-size:11px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:0 7px;margin-top:14px;letter-spacing:.05em}
.fc-mean{font-size:23px;font-weight:700;margin-bottom:12px}
.fc-ex{font-size:15px;color:var(--tx);line-height:1.85;border-top:1px solid var(--line);margin-top:2px;cursor:pointer;border-radius:0 0 8px 8px;padding:12px 8px 4px}
@media(hover:hover){.fc-ex:hover{background:var(--ac-soft)}}
.fc-ex .py{font-size:12.5px;color:var(--tx3);display:block}
.fc-ex .tr{font-size:13.5px;color:var(--tx2);display:block;margin-top:2px}
.fc-grade{display:flex;gap:8px;margin-top:14px;width:100%}
.fc-grade button{flex:1;border:1px solid var(--bd);background:var(--bg3);border-radius:12px;padding:9px 4px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--tx);line-height:1.3}
.fc-grade button small{display:block;font-weight:500;font-size:10.5px;color:var(--tx3)}
.fc-grade .g-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--bd))}
.fc-grade .g-mid{color:#B07A1F}
.fc-grade .g-ng{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
@media(hover:hover){.fc-grade button:hover{border-color:currentColor}}
.fc-ctrl{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:999px;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer}
@media(hover:hover){.btn:hover{border-color:var(--ac);color:var(--ac)}}
.btn.primary{background:var(--tx);color:var(--bg);border-color:var(--tx)}
@media(hover:hover){.btn.primary:hover{background:var(--ac);border-color:var(--ac);color:#fff}}
.fc-prog{text-align:center;font-size:13px;color:var(--tx3);margin-top:12px}
.tts-btn{background:var(--ac-soft);border:none;color:var(--ac);border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0}
@media(hover:hover){.tts-btn:hover{background:var(--ac);color:#fff}}

/* == Word list == */
.search{width:100%;max-width:380px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:8px}
.search:focus{outline:none;border-color:var(--ac)}
.pos-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.pos-btn{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:999px;padding:3px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.pos-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.vlist{grid-template-columns:1fr}}
.vcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);cursor:pointer}
@media(hover:hover){.vcard:hover{border-color:var(--ac)}}
.vcard-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vcard-w{font-family:var(--serif);font-size:26px;font-weight:700}
.vcard-zy{font-size:12px;color:var(--ac);letter-spacing:.08em}
.vcard-py{font-size:14px;color:var(--tx2)}
.vcard-pos{font-size:10.5px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:5px;padding:0 5px;margin-left:auto}
.vcard-m{font-size:15px;font-weight:600;margin-top:4px}
.vcard-ex{font-size:13.5px;color:var(--tx2);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;line-height:1.8;border-radius:6px}
@media(hover:hover){.vcard-ex:hover{background:var(--ac-soft)}}
.vcard-ex b{color:var(--tx);font-weight:600}

/* == Grammar == */
.gcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.gcard summary{cursor:pointer;list-style:none;padding:16px 20px;display:flex;align-items:center;gap:12px}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary::after{content:'+';color:var(--ac);font-size:20px;margin-left:auto}
.gcard[open] summary::after{content:'−'}
.g-cat{font-size:10.5px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:5px;padding:0 6px;white-space:nowrap}
.g-title{font-family:var(--serif);font-size:17px;font-weight:700}
.g-body{padding:0 20px 18px}
.g-pattern{display:inline-block;background:var(--ac-soft);color:var(--ac);font-weight:700;font-size:13.5px;border-radius:8px;padding:4px 12px;margin-bottom:10px}
.g-ex{font-size:14px;color:var(--tx2);line-height:1.9;margin-bottom:12px}
.g-eg{border-top:1px dashed var(--line);padding-top:10px;font-size:15px;line-height:1.9}
.g-eg .zh{color:var(--tx);font-weight:500;cursor:pointer;border-radius:6px;padding:1px 4px}
@media(hover:hover){.g-eg .zh:hover{background:var(--ac-soft)}}
.g-eg .zh em{font-style:normal;color:var(--ac);font-weight:700}
.g-eg .py{font-size:12.5px;color:var(--tx3);display:block}
.g-eg .tr{font-size:13.5px;color:var(--tx2);display:block;margin-bottom:8px}

/* == Phrases == */
.ph-cat{font-family:var(--serif);font-size:20px;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.ph-cat:first-child{margin-top:0}
.ph-item{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
@media(hover:hover){.ph-item:hover{border-color:var(--ac)}}
.ph-main{flex:1;min-width:0}
.ph-z{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.5}
.ph-py{font-size:13px;color:var(--tx3)}
.ph-m{font-size:14.5px;color:var(--tx2);margin-top:3px}
.ph-note{font-size:12.5px;color:var(--ac);background:var(--ac-soft);border-radius:8px;padding:6px 10px;margin-top:8px;line-height:1.7}

/* == Quiz == */
.qz{max-width:520px;margin:0 auto;text-align:center}
.qz-word{font-family:var(--serif);font-size:clamp(40px,8vw,56px);font-weight:700;margin:8px 0 2px;cursor:pointer}
.qz-py{color:var(--tx2);font-size:15px;margin-bottom:22px}
.qz-opts{display:grid;gap:10px}
.qz-opt{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:12px;padding:13px 16px;font-size:15.5px;font-weight:600;cursor:pointer;text-align:left}
@media(hover:hover){.qz-opt:hover{border-color:var(--ac)}}
.qz-opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qz-opt.ng{background:var(--ac);border-color:var(--ac);color:#fff;opacity:.85}
.qz-opt:disabled{cursor:default}
.qz-score{font-size:14px;color:var(--tx2);margin:16px 0}
.qz-big{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--ac)}

/* == 注音 ㄅㄆㄇ == */
.zy-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.zy-tab{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.zy-tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.zy-group{margin-bottom:22px}
.zy-group h4{font-size:12px;letter-spacing:.1em;color:var(--ac);font-weight:700;margin-bottom:10px}
.zy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.zy-cell{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer;transition:transform .1s var(--ease),border-color .1s;-webkit-tap-highlight-color:transparent}
.zy-cell:active{transform:scale(.93)}
.zy-cell.play{border-color:var(--ac);background:var(--ac-soft)}
.zy-cell .zy-z{font-family:var(--serif);font-size:29px;font-weight:700;line-height:1.1}
.zy-cell .zy-py{font-size:11.5px;color:var(--tx2);margin-top:3px}
.zy-hint{text-align:center;font-size:13px;color:var(--tx3);margin-bottom:16px}
.zy-test{max-width:460px;margin:0 auto;text-align:center}
.zy-prompt{font-family:var(--serif);font-size:76px;font-weight:700;line-height:1;margin:8px 0}
.zy-play-btn{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer;margin:6px 0 18px;font-family:inherit}
.zy-input{width:100%;max-width:260px;border:2px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:12px;padding:12px 16px;font-size:20px;text-align:center;font-weight:700;font-family:inherit}
.zy-input:focus{outline:none;border-color:var(--ac)}
.zy-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
.zy-opt{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:12px;padding:16px;font-family:var(--serif);font-size:34px;font-weight:700;cursor:pointer}
.zy-opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.zy-opt.ng{background:var(--ac);border-color:var(--ac);color:#fff;opacity:.85}
.zy-fb{font-size:15px;font-weight:700;margin:14px 0 4px;min-height:22px}
.zy-fb.ok{color:var(--ok)}.zy-fb.ng{color:var(--ac)}
.zy-prog{font-size:13px;color:var(--tx3);margin-top:14px}
@media(hover:hover){.zy-cell:hover{border-color:var(--ac)}.zy-opt:hover{border-color:var(--ac)}.zy-tab:hover{color:var(--ac)}}

/* == スピーキング == */
.spk{max-width:560px;margin:0 auto;text-align:center}
.spk-src{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.spk-card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:var(--sh2)}
.spk-z{font-family:var(--serif);font-size:clamp(24px,5vw,32px);font-weight:700;line-height:1.6;cursor:pointer}
@media(hover:hover){.spk-z:hover{color:var(--ac)}}
.spk-py{color:var(--tx3);font-size:14px;margin-top:6px}
.spk-tr{color:var(--tx2);font-size:14.5px;margin-top:4px}
.spk-mic{width:88px;height:88px;border-radius:50%;border:none;background:var(--ac);color:#fff;font-size:36px;cursor:pointer;margin:22px auto 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(184,54,42,.3);transition:transform .15s var(--ease)}
@media(hover:hover){.spk-mic:hover{transform:scale(1.06)}}
.spk-mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,54,42,.45)}50%{box-shadow:0 0 0 18px rgba(184,54,42,0)}}
.spk-status{font-size:13px;color:var(--tx3);min-height:20px}
.spk-result{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;text-align:left}
.spk-heard{font-family:var(--serif);font-size:20px;line-height:1.7}
.spk-heard .hit{color:var(--ok,#2F7A5D)}
.spk-heard .miss{color:var(--ac);text-decoration:line-through}
.spk-scorebar{display:flex;align-items:center;gap:12px;margin-top:10px}
.spk-score-num{font-family:var(--serif);font-size:34px;font-weight:700}
.spk-meter{flex:1;height:8px;background:var(--bg3);border-radius:99px;overflow:hidden}
.spk-meter i{display:block;height:100%;background:var(--ok,#2F7A5D);border-radius:99px;transition:width .5s var(--ease)}
.spk-verdict{font-size:13.5px;color:var(--tx2);margin-top:6px}

/* == ライティング == */
.wr{max-width:680px;margin:0 auto}
.wr-topic{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:14px}
@media(hover:hover){.wr-topic:hover{border-color:var(--ac)}}
.wr-topic .lv{font-size:11px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:1px 8px;white-space:nowrap}
.wr-topic h4{font-size:16px;font-weight:700}
.wr-topic .done{margin-left:auto;font-size:12px;color:var(--ok)}
.wr-task{background:var(--ac-soft);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.8;margin:12px 0}
.wr-hints{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.wr-hint{background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:4px 13px;font-size:13.5px;cursor:pointer}
@media(hover:hover){.wr-hint:hover{border-color:var(--ac);color:var(--ac)}}
.wr-hint small{color:var(--tx3);margin-left:5px}
.wr-ta{width:100%;min-height:180px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.9;font-family:inherit;resize:vertical}
.wr-ta:focus{outline:none;border-color:var(--ac)}
.wr-meta{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--tx3);margin:8px 2px 18px}
.wr-model{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px}
.wr-model .zh{font-family:var(--serif);font-size:16.5px;line-height:2;cursor:pointer;border-radius:8px}
@media(hover:hover){.wr-model .zh:hover{background:var(--ac-soft)}}
.wr-model .tr{font-size:13.5px;color:var(--tx2);line-height:1.9;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}

/* == SRS == */
.srs-home{max-width:640px}
.srs-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:18px 0}
.srs-stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.srs-stat b{font-family:var(--serif);font-size:26px;display:block;line-height:1.2}
.srs-stat span{font-size:11.5px;color:var(--tx3)}
.srs-stat.hot b{color:var(--ac)}
/* 復習モーダル */
.quiz-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.quiz-bg.show{display:flex}
.quiz-box{background:var(--bg);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:18px 20px}
.qhd{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx3);margin-bottom:12px}
.qclose{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:8px;padding:2px 10px;cursor:pointer}
.srs-card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center;cursor:pointer;min-height:280px;display:flex;flex-direction:column;justify-content:center}
.srs-card .qmain{font-family:var(--serif);font-size:48px;font-weight:700;line-height:1.2}
.srs-card .qsub{color:var(--tx2);font-size:15px;margin-top:8px}
.srs-hint{font-size:12px;color:var(--tx3);margin-top:22px}
.srs-meaning{font-size:21px;font-weight:700;margin:12px 0}
.srs-ex{font-size:14px;line-height:1.8;border-top:1px dashed var(--line);padding-top:10px;border-radius:8px}
@media(hover:hover){.srs-ex:hover{background:var(--ac-soft)}}
.srs-ex .py{display:block;font-size:12px;color:var(--tx3)}
.srs-ex .tr{display:block;font-size:12.5px;color:var(--tx2)}
.srs-btns{display:flex;gap:8px;margin-top:18px}
.srs-btn{flex:1;border:none;border-radius:12px;padding:11px 4px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.srs-ng{background:var(--ac)}
.srs-mid{background:#B07A1F}
.srs-ok{background:var(--ok)}

/* == 模試 == */
.ex-home{max-width:640px}
.ex-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ex-sec{font-size:12px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:1px 8px}
.ex-passage{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:16px;line-height:2;margin-bottom:16px;cursor:pointer;font-family:var(--serif)}
@media(hover:hover){.ex-passage:hover{border-color:var(--ac)}}
.ex-stem{font-size:18px;font-weight:600;margin-bottom:16px;line-height:1.8;cursor:pointer}
.ex-stem.big{font-family:var(--serif);font-size:40px;text-align:center;font-weight:700}
.ex-listen{text-align:center;padding:26px 0 20px}
.ex-play{width:84px;height:84px;border-radius:50%;border:none;background:var(--ac);color:#fff;font-size:34px;cursor:pointer;box-shadow:0 6px 20px rgba(184,54,42,.3);transition:transform .15s var(--ease)}
@media(hover:hover){.ex-play:hover{transform:scale(1.06)}}
.ex-hist{border-top:1px solid var(--line);margin-top:26px;padding-top:14px}
.ex-hist-item{display:flex;gap:14px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--tx2)}
.ex-hist-item b{color:var(--tx)}
.coming{padding:60px 20px;text-align:center;color:var(--tx3);font-size:15px;border:1px dashed var(--line);border-radius:14px}

/* == 付費牆 == */
.pw-quota{display:inline-block;font-size:12.5px;color:var(--tx2);background:var(--bg3);border:1px solid var(--bd);border-radius:999px;padding:3px 12px;margin:8px 0}
.pw-benefits{list-style:none;margin:14px 0;padding:0}
.pw-benefits li{font-size:13.5px;color:var(--tx);padding:5px 0;line-height:1.6}
.pw-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
.pw-plan{position:relative;border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:14px 6px 10px;text-align:center}
.pw-plan.hot{border:2px solid var(--ac)}
.pw-plan b{display:block;font-family:var(--serif);font-size:17px}
.pw-plan span{font-size:10.5px;color:var(--tx3);display:block;line-height:1.4}
.pw-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff!important;font-size:9.5px!important;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}

/* == Footer == */
.ft{padding:40px 24px;color:var(--tx3);font-size:12px;border-top:1px solid var(--line);text-align:center;line-height:1.9}

/* == モバイル下部ナビ == */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:120;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn-item{flex:1;background:none;border:none;color:var(--tx3);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;position:relative;font-family:inherit;-webkit-tap-highlight-color:transparent}
.bn-item .bi{font-size:21px;line-height:1.2}
.bn-item.on{color:var(--ac)}
.bn-item .badge{position:absolute;top:-1px;left:calc(50% + 7px);background:var(--ac);color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:180;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:190;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s var(--ease);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.more-open .sheet-bg{opacity:1;pointer-events:auto}
.more-open .sheet{transform:none}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-item{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer;font-family:inherit;text-decoration:none;display:block;-webkit-tap-highlight-color:transparent}
.sheet-item .bi{display:block;font-size:22px;margin-bottom:5px}
.bn-item .bi svg,.sheet-item .bi svg{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto}
.bn-item .bi{height:24px;display:flex;align-items:center;justify-content:center;font-size:20px}
.bn-item .bi svg{width:23px;height:23px}
.sheet-item .bi svg{width:24px;height:24px}
/* インライン線アイコン（発音ボタン等、絵文字の代わり） */
.ic{width:1.05em;height:1.05em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;display:inline-block;flex:none}

@media(max-width:700px){
  .tools{display:none}
  .bnav{display:flex}
  /* モバイルは backdrop-blur を切る＝タブ切替のカクつき解消（GPU 合成が重い） */
  .hd,.bnav{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  /* モバイル：レベルは横スクロールせず 5 段すべて一目で見える等幅に */
  .levels{flex-wrap:nowrap;gap:5px}
  .levels .lv-label{display:none}
  .lv-btn{flex:1;min-width:0;padding:6px 2px;font-size:12.5px;border-radius:11px}
  .lv-btn small{font-size:9px;letter-spacing:0}
  .voice-sel{display:none}
  .search{font-size:16px}          /* 16px 未満だと iOS がフォーカス時にズームする */
  .pos-btn{padding:7px 15px;font-size:13px}
  .fc-grade button{padding:12px 4px}
}
@media(max-width:600px){
  .hd-inner{padding:0 12px;gap:8px}
  .hd h1{font-size:13px}
  .hd h1 img{width:22px;height:25px}
  .hd-links{gap:8px}
  .hd-links a.hide-sp{display:none}
  .wrap{padding-top:calc(var(--hh) + env(safe-area-inset-top) + 18px);padding-left:16px;padding-right:16px}
}
</style>

<script>
/* ===== テーマ ===== */
function toggleTheme(){
  const d = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = d ? "" : "dark";
  localStorage.setItem("stw-theme", d ? "light" : "dark");
}
(function(){
  const saved = localStorage.getItem("stw-theme");
  if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches))
    document.documentElement.dataset.theme = "dark";
})();

/* ===== レベルデータ ===== */
const VOCAB_BY_LEVEL   = { l1: VOCAB_L1, l2: VOCAB_L2, l3: VOCAB_L3, l4: VOCAB_L4, l5: VOCAB_L5 };
const GRAMMAR_BY_LEVEL = { l1: GRAMMAR_L1, l2: GRAMMAR_L2, l3: GRAMMAR_L3, l4: GRAMMAR_L4, l5: GRAMMAR_L5 };
function getVocabData(lv){ return VOCAB_BY_LEVEL[lv] || []; }
function getGrammarData(lv){ return GRAMMAR_BY_LEVEL[lv] || []; }
let currentLevel = localStorage.getItem("stw-level") || "l1";

function setLevel(lv){
  currentLevel = lv;
  localStorage.setItem("stw-level", lv);
  document.querySelectorAll(".lv-btn").forEach(b => b.classList.toggle("on", b.dataset.lv === lv));
  deck = [...getVocabData(lv)]; fcIdx = 0; posFilter = "all";
  renderCard(); renderPosRow(); renderList(); renderGrammar(); renderSrsHome(); renderExamHome();
  qzReset(); SPK.reset();
}
document.querySelectorAll(".lv-btn").forEach(b => b.onclick = () => setLevel(b.dataset.lv));

/* ===== タブ（上部タブ＋モバイル下部ナビの両方から呼ぶ） ===== */
function switchPanel(p){
  document.querySelectorAll(".tool-btn").forEach(x=>x.classList.toggle("on", x.dataset.panel===p));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
  document.getElementById("panel-"+p).classList.add("on");
  const bn = ["fc","quiz","srs","exam"].includes(p) ? p : "more";
  document.querySelectorAll(".bn-item").forEach(x=>x.classList.toggle("on", x.dataset.bn===bn));
  if (p === "srs") renderSrsHome();                       // 最新の学習数を反映
  if (p === "exam" && !document.getElementById("exTimer")) renderExamHome();
  if (p === "speak") SPK.render();
  if (p === "write") WR.render();
  if (p === "zhuyin") ZY.render();
  // レベル選択は語彙系のみ関係。注音・フレーズ等では隠す
  const noLevel = ["zhuyin", "phrases", "speak", "write"].includes(p);
  const lv = document.querySelector(".levels"); if (lv) lv.style.display = noLevel ? "none" : "";
  window.scrollTo({top:0});
}
document.querySelectorAll(".tool-btn").forEach(b=>{ b.onclick = () => switchPanel(b.dataset.panel); });
function toggleMore(show){ document.body.classList.toggle("more-open", show); }
document.querySelectorAll(".bn-item").forEach(b=>{
  b.onclick = () => { if (b.dataset.bn === "more") { toggleMore(true); return; } switchPanel(b.dataset.bn); };
});
document.querySelectorAll("#moreSheet button[data-panel]").forEach(b=>{
  b.onclick = () => { toggleMore(false); switchPanel(b.dataset.panel); };
});

/* ===== 単語カード（枠内タップで発音＋めくり = 原サイトと同じ）===== */
let deck = [...getVocabData(currentLevel)], fcIdx = 0;
function renderCard(){
  const w = deck[fcIdx], mk = twMKey();
  document.getElementById("fc").classList.remove("flip");
  document.getElementById("fcWord").textContent = w.w;
  document.getElementById("fcZy").textContent = w.zy;
  document.getElementById("fcPy").textContent = w.py;
  document.getElementById("fcPos").textContent = w.c;
  document.getElementById("fcMean").textContent = w.m[mk] || w.m.j;
  document.getElementById("fcEx").innerHTML =
    `<span>${w.ex.z} <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></span><span class="py">${w.ex.py}</span><span class="tr">${w.ex[mk] || w.ex.j}</span>`;
  document.getElementById("fcEx").onclick = e => { e.stopPropagation(); speakZh(w.ex.z); };
  document.getElementById("fcProg").textContent = `${fcIdx+1} / ${deck.length}`;
}
function flipCard(){
  const el = document.getElementById("fc");
  el.classList.toggle("flip");
  speakZh(deck[fcIdx].w); // カードをタップ → 発音（表→裏でも裏→表でも鳴る）
  document.getElementById("fcHint").textContent = twT(el.classList.contains("flip") ? "cardHintBack" : "cardHintFront");
}
function fcMove(d){
  fcIdx = (fcIdx + d + deck.length) % deck.length;
  renderCard();
  document.getElementById("fcHint").textContent = twT("cardHintFront");
}
function fcShuffle(){ deck.sort(()=>Math.random()-.5); fcIdx = 0; renderCard(); }
function fcGrade(g){
  const w = deck[fcIdx].w;
  SRS.recordGrade(currentLevel, w, g);
  updateSrsBadges();
  const subs = { known: "srsG1sub", soso: "srsG2sub", unknown: "srsG3sub" };
  showToast(`✓ ${w}　${twT("gradeSaved")}${twT(subs[g])}`);
  fcMove(1);
}

/* ===== トースト ===== */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ===== キーボード操作（単語カード表示中のみ） ===== */
document.addEventListener("keydown", e => {
  if (e.target && e.target.matches && e.target.matches("input, select, textarea")) return;
  if (document.getElementById("quizBg").classList.contains("show")) {
    // 復習モーダル内: Space=めくる, 1/2/3=評価
    if (e.code === "Space") { e.preventDefault(); SRS.flip(); }
    if (e.key === "1") SRS.rate("unknown");
    if (e.key === "2") SRS.rate("soso");
    if (e.key === "3") SRS.rate("known");
    if (e.key === "Escape") SRS.close();
    return;
  }
  if (!document.getElementById("panel-fc").classList.contains("on")) return;
  if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); flipCard(); }
  if (e.key === "ArrowLeft") fcMove(-1);
  if (e.key === "ArrowRight") fcMove(1);
  const flipped = document.getElementById("fc").classList.contains("flip");
  if (flipped && e.key === "1") fcGrade("unknown");
  if (flipped && e.key === "2") fcGrade("soso");
  if (flipped && e.key === "3") fcGrade("known");
});

/* ===== はじめての流れ ===== */
function dismissOb(){
  localStorage.setItem("stw-onboarded", "1");
  document.getElementById("obStrip").style.display = "none";
}

/* ===== レベル名（言語別） ===== */
function renderLevelLabels(){
  document.querySelectorAll("[data-lvname]").forEach(el => el.textContent = twT("lv_" + el.dataset.lvname));
}

/* ===== 単語リスト（カードタップ = 単語発音、例文タップ = 例文発音）===== */
let posFilter = "all";
function renderPosRow(){
  const cats = [...new Set(getVocabData(currentLevel).map(v=>v.c))];
  document.getElementById("posRow").innerHTML =
    [`<button class="pos-btn ${posFilter==="all"?"on":""}" onclick="setPos('all')">${twT("posAll")}</button>`]
    .concat(cats.map(c=>`<button class="pos-btn ${posFilter===c?"on":""}" onclick="setPos('${c}')">${c}</button>`)).join("");
}
function setPos(c){ posFilter = c; renderPosRow(); renderList(); }
function renderList(){
  const q = (document.getElementById("vSearch").value || "").toLowerCase();
  const mk = twMKey();
  const rows = getVocabData(currentLevel).filter(v =>
    (posFilter === "all" || v.c === posFilter) &&
    (!q || v.w.includes(q) || v.py.toLowerCase().includes(q) ||
      Object.values(v.m).some(s=>s.toLowerCase().includes(q)))
  );
  document.getElementById("vList").innerHTML = rows.map((v,i)=>`
    <div class="vcard" data-i="${i}">
      <div class="vcard-top">
        <span class="vcard-w">${v.w}</span>
        <span><span class="vcard-zy">${v.zy}</span><br><span class="vcard-py">${v.py}</span></span>
        <span class="vcard-pos">${v.c}</span>
      </div>
      <div class="vcard-m">${v.m[mk] || v.m.j}</div>
      <div class="vcard-ex" data-ex="1"><b>${v.ex.z}</b> <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg><br>${v.ex.py}<br>${v.ex[mk] || v.ex.j}</div>
    </div>`).join("");
  // 枠内タップで発音（例文部分は例文を読む）
  document.querySelectorAll("#vList .vcard").forEach(card=>{
    const v = rows[+card.dataset.i];
    card.onclick = e => speakZh(e.target.closest(".vcard-ex") ? v.ex.z : v.w);
  });
}

/* ===== 文法（例文タップで発音）===== */
function renderGrammar(){
  const mk = twMKey();
  document.getElementById("gList").innerHTML = getGrammarData(currentLevel).map(g=>`
    <details class="gcard">
      <summary><span class="g-cat">${twGCat(g.cat)}</span><span class="g-title">${g.t}${g.g ? `<span style="font-weight:400;color:var(--tx2);font-size:.85em">（${g.g[mk] || g.g.j}）</span>` : ""}</span></summary>
      <div class="g-body">
        <div class="g-pattern">${typeof g.p === "object" ? (g.p[mk] || g.p.j) : g.p}</div>
        <div class="g-ex">${g.ex[mk] || g.ex.j}</div>
        <div class="g-eg">${g.eg.map(e=>`
          <span class="zh" onclick="speakZh(this.dataset.z)" data-z="${e.z.replace(/<[^>]+>/g,"")}">${e.z} <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></span>
          <span class="py">${e.py}</span><span class="tr">${e[mk] || e.j}</span>`).join("")}
        </div>
      </div>
    </details>`).join("");
}

/* ===== フレーズ（枠内タップで発音・旅行/暮らしフィルタ）===== */
let phFilter = "all";
function setPhFilter(f){ phFilter = f; renderPhrases(); }
function renderPhrases(){
  const lang = twGetLang(), ck = {ja:"j",en:"e",ko:"k"}[lang], mk = twMKey();
  document.getElementById("phFilterRow").innerHTML = [
    ["all", twT("phAll")], ["travel", "🧳 " + twT("phTravel")], ["life", "🏠 " + twT("phLife")]
  ].map(([f,label])=>`<button class="pos-btn ${phFilter===f?"on":""}" onclick="setPhFilter('${f}')">${label}</button>`).join("");
  const secs = PHRASES_L1.filter(s => phFilter === "all" || s.t === phFilter || s.t === "both");
  document.getElementById("phList").innerHTML = secs.map(sec=>`
    <div class="ph-cat">${sec.icon} ${sec.cat[ck]}</div>
    ${sec.items.map(it=>`
      <div class="ph-item" onclick="speakZh(this.dataset.z)" data-z="${it.z}">
        <div class="ph-main">
          <div class="ph-z">${it.z}</div>
          <div class="ph-py">${it.py}</div>
          <div class="ph-m">${it.m[mk] || it.m.j}</div>
          ${it.note ? `<div class="ph-note">💡 ${it.note[ck] || it.note.j}</div>` : ""}
        </div>
        <button class="tts-btn" onclick="event.stopPropagation();speakZh('${it.z}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button>
      </div>`).join("")}`).join("");
}

/* ===== クイズ（4択 / 入力の2モード・結果は SRS に記録）===== */
let quizStarted = false, qzOrder = [], qzIdx = 0, qzScore = 0, qzMode = localStorage.getItem("stw-qzmode") || "choice";
function setQzMode(m){ qzMode = m; localStorage.setItem("stw-qzmode", m); qzReset(); }
function renderQzModeRow(){
  document.getElementById("qzModeRow").innerHTML = [
    ["choice", "🎯 " + twT("qzModeChoice")], ["type", "⌨️ " + twT("qzModeType")]
  ].map(([m,label])=>`<button class="pos-btn ${qzMode===m?"on":""}" onclick="setQzMode('${m}')">${label}</button>`).join("");
}
function qzReset(){
  quizStarted = false;
  renderQzModeRow();
  document.getElementById("qzBox").innerHTML =
    `<p style="color:var(--tx2);margin:30px 0 8px">${qzMode==="type" ? twT("qzTypeHint") : twT("quizQ")}</p>
     ${Paywall.quotaBadge("quiz")}
     <div style="margin-top:12px"><button class="btn primary" onclick="Paywall.gate('quiz',qzStart)">${twT("quizStart")}</button></div>`;
}
function qzStart(){
  quizStarted = true; qzScore = 0; qzIdx = 0;
  qzOrder = [...getVocabData(currentLevel)].sort(()=>Math.random()-.5).slice(0,10);
  qzNext();
}
function qzNext(){
  if (qzIdx >= qzOrder.length) return qzDone();
  const w = qzOrder[qzIdx], mk = twMKey();
  if (qzMode === "type") {
    document.getElementById("qzBox").innerHTML = `
      <div style="font-size:13px;color:var(--tx3)">${qzIdx+1} / ${qzOrder.length}　${twT("quizScore")}: ${qzScore}</div>
      <div style="font-size:24px;font-weight:700;margin:22px 0 4px">${w.m[mk] || w.m.j}</div>
      <div style="margin-bottom:18px"><button class="tts-btn" onclick="speakZh('${w.w}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button></div>
      <input class="search" id="qzInput" style="max-width:320px;text-align:center;font-size:18px" placeholder="${twT("qzTypePh")}" autocomplete="off">
      <div style="margin-top:14px"><button class="btn primary" onclick="qzTypeAnswer()">${twT("qzSubmit")}</button></div>
      <div id="qzTypeResult" style="margin-top:16px;min-height:52px"></div>`;
    const inp = document.getElementById("qzInput");
    inp.focus();
    inp.onkeydown = e => { if (e.key === "Enter") { e.stopPropagation(); qzTypeAnswer(); } };
    speakZh(w.w);
    return;
  }
  const wrong = getVocabData(currentLevel).filter(v=>v.w!==w.w).sort(()=>Math.random()-.5).slice(0,3);
  const opts = [w, ...wrong].sort(()=>Math.random()-.5);
  document.getElementById("qzBox").innerHTML = `
    <div style="font-size:13px;color:var(--tx3)">${qzIdx+1} / ${qzOrder.length}　${twT("quizScore")}: ${qzScore}</div>
    <div class="qz-word" onclick="speakZh('${w.w}')">${w.w}</div>
    <div class="qz-py">${w.zy}　${w.py}　<button class="tts-btn" style="width:30px;height:30px;font-size:13px" onclick="speakZh('${w.w}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></button></div>
    <div class="qz-opts">${opts.map(o=>
      `<button class="qz-opt" data-ok="${o.w===w.w}" onclick="qzAnswer(this)">${o.m[mk] || o.m.j}</button>`).join("")}
    </div>`;
  speakZh(w.w);
}
// 拼音の声調・スペースを吸収して比較（lǚ → lu, "hao chi" → haochi, v→u も許容）
function normPy(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[\s'’\-·.]/g,"").replace(/v/g,"u");
}
function qzTypeAnswer(){
  const w = qzOrder[qzIdx];
  const inp = document.getElementById("qzInput");
  if (!inp || quizStarted !== true) return;
  const raw = (inp.value || "").trim();
  if (!raw) return;
  const ok = raw === w.w || normPy(raw) === normPy(w.py);
  SRS.record(currentLevel, w.w, ok);
  updateSrsBadges();
  if (ok) qzScore++;
  inp.disabled = true;
  document.getElementById("qzTypeResult").innerHTML =
    `<div style="font-size:15px;font-weight:700;color:${ok ? "var(--ok)" : "var(--ac)"}">${ok ? "⭕" : "❌"}　${twT("qzCorrectIs")}<span style="font-family:var(--serif);font-size:22px">${w.w}</span>（${w.zy}｜${w.py}）</div>`;
  setTimeout(()=>{ qzIdx++; qzNext(); }, ok ? 1000 : 2200);
}
function qzAnswer(btn){
  const ok = btn.dataset.ok === "true";
  const w = qzOrder[qzIdx];
  SRS.record(currentLevel, w.w, ok);
  updateSrsBadges();
  document.querySelectorAll("#qzBox .qz-opt").forEach(b=>{
    b.disabled = true;
    if (b.dataset.ok === "true") b.classList.add("ok");
  });
  if (ok) qzScore++; else btn.classList.add("ng");
  setTimeout(()=>{ qzIdx++; qzNext(); }, ok ? 700 : 1400);
}
function qzDone(){
  document.getElementById("qzBox").innerHTML = `
    <p style="margin:26px 0 8px;color:var(--tx2)">${twT("quizDone")}</p>
    <div class="qz-big">${qzScore} / ${qzOrder.length}</div>
    <div style="margin-top:22px"><button class="btn primary" onclick="Paywall.gate('quiz',qzStart)">${twT("quizRetry")}</button></div>`;
}

/* ===== スピーキング（跟読・音声認識で判定）===== */
const SPK = (() => {
  const SRCls = window.SpeechRecognition || window.webkitSpeechRecognition;
  let src = "vocab", items = [], idx = 0, rec = null, recording = false;

  function buildItems(){
    const mk = twMKey();
    if (src === "phrase") {
      items = PHRASES_L1.flatMap(s => s.items.map(it => ({ z: it.z, py: it.py, tr: it.m[mk] || it.m.j })));
    } else {
      items = getVocabData(currentLevel).map(v => ({ z: v.ex.z, py: v.ex.py, tr: v.ex[mk] || v.ex.j }));
    }
    items.sort(() => Math.random() - .5);
    idx = 0;
  }
  const strip = s => String(s).replace(/[，。！？；：、,.!?;:\s（）()「」『』…—～\d０-９a-zA-Z]/g, "");

  // LCS で「どの字が言えたか」を判定
  function diff(target, heard){
    const a = strip(target), b = strip(heard);
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    const hit = new Array(m).fill(false);
    let i = m, j = n;
    while (i > 0 && j > 0) {
      if (a[i-1] === b[j-1]) { hit[i-1] = true; i--; j--; }
      else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--;
    }
    const score = m ? Math.round(dp[m][n] / m * 100) : 0;
    return { chars: [...a].map((c, k) => ({ c, hit: hit[k] })), score };
  }

  function render(){
    if (!items.length) buildItems();
    const it = items[idx];
    document.getElementById("spkBox").innerHTML = `
      <p style="font-size:14px;color:var(--tx2);line-height:1.9;text-align:left">${twT("spkIntro")}</p>
      ${SRCls ? "" : `<p style="font-size:12.5px;color:var(--ac);background:var(--ac-soft);border-radius:8px;padding:8px 12px">${twT("spkNoSupport")}</p>`}
      ${SRCls && /Edg\//.test(navigator.userAgent) ? `<p style="font-size:12.5px;color:var(--ac);background:var(--ac-soft);border-radius:8px;padding:8px 12px">${twT("spkEdgeNote")}</p>` : ""}
      <div class="spk-src">
        <button class="pos-btn ${src==="vocab"?"on":""}" onclick="SPK.setSrc('vocab')">${twT("spkSourceVocab")}</button>
        <button class="pos-btn ${src==="phrase"?"on":""}" onclick="SPK.setSrc('phrase')">${twT("spkSourcePhrase")}</button>
      </div>
      <div class="spk-card">
        <div class="spk-z" onclick="speakZh(this.dataset.z)" data-z="${it.z}">${it.z} <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg></div>
        <div class="spk-py">${it.py}</div>
        <div class="spk-tr">${it.tr}</div>
        ${SRCls ? `<button class="spk-mic" id="spkMic" onclick="SPK.toggle()">🎤</button>
        <div class="spk-status" id="spkStatus">${twT("spkRecord")}</div>` : ""}
        <div id="spkResult"></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px">
        <button class="btn" onclick="speakZh('${it.z}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg> ${twT("spkListen")}</button>
        <button class="btn primary" onclick="SPK.next()">${twT("spkNext")}</button>
      </div>
      <div style="font-size:13px;color:var(--tx3);margin-top:10px">${idx+1} / ${items.length}</div>`;
  }

  function showResult(heard){
    const it = items[idx];
    const { chars, score } = diff(it.z, heard);
    const verdict = score >= 90 ? twT("spkPerfect") : score >= 60 ? twT("spkGood") : twT("spkTry");
    document.getElementById("spkResult").innerHTML = `
      <div class="spk-result">
        <div style="font-size:12px;color:var(--tx3)">${twT("spkRecognized")}</div>
        <div class="spk-heard">${chars.map(c => `<span class="${c.hit ? "hit" : "miss"}">${c.c}</span>`).join("")}</div>
        <div class="spk-scorebar">
          <span class="spk-score-num" style="color:${score >= 60 ? "var(--ok)" : "var(--ac)"}">${score}%</span>
          <div class="spk-meter"><i style="width:${score}%;background:${score >= 60 ? "var(--ok)" : "var(--ac)"}"></i></div>
        </div>
        <div class="spk-verdict">${verdict}　<span style="color:var(--tx3)">（${heard}）</span></div>
      </div>`;
  }

  let stopTimer = null;
  function toggle(){
    if (recording) { try { rec && rec.stop(); } catch (e) {} return; }
    Paywall.gate("speak", startRec); // 録音1回 = 無料枠1消費
  }
  async function startRec(){
    const mic = document.getElementById("spkMic"), st = document.getElementById("spkStatus");
    if (!SRCls) return;
    // マイク許可は SpeechRecognition 自身に任せる。
    // （以前の getUserMedia 事前チェックは「許可を二重に求める＋一瞬録音が点いて消える」
    //   問題を起こしていたため撤去。拒否時は onerror('not-allowed') が拾う）
    TTS.stop(); // お手本再生を止めてから録音
    rec = new SRCls();
    rec.lang = "zh-TW"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let finalText = "", gotError = "";
    rec.onstart = () => {
      recording = true; mic.classList.add("rec"); st.textContent = twT("spkListening");
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => { try { rec.stop(); } catch (e) {} }, 8000); // 8秒で自動停止（iOS は stop 後に結果が届く）
    };
    rec.onresult = e => {
      let interim = "";
      for (const r of e.results) (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript));
      if (interim) st.textContent = "… " + interim; // 認識中の途中経過を見せる
    };
    rec.onerror = ev => {
      gotError = ev.error || "error";
    };
    rec.onend = () => {
      recording = false; mic.classList.remove("rec");
      clearTimeout(stopTimer);
      if (finalText) { st.textContent = twT("spkRecord"); showResult(finalText); return; }
      if (gotError === "language-not-supported")
        st.textContent = twT("spkErrLang");
      else if (gotError === "not-allowed" || gotError === "audio-capture" || gotError === "service-not-allowed")
        st.textContent = twT("spkErrMic");
      else if (gotError === "network")
        st.textContent = twT("spkErrNet");
      else
        st.textContent = twT("spkErrNoSpeech");
    };
    try { rec.start(); } catch (e) { recording = false; st.textContent = twT("spkErrMic"); }
  }

  function next(){ idx = (idx + 1) % items.length; render(); }
  function setSrc(s){ src = s; buildItems(); render(); }
  function reset(){ items = []; render(); }
  return { render, toggle, next, setSrc, reset };
})();

/* ===== ライティング ===== */
const WR = (() => {
  let cur = null, saveTimer = null;
  const drafts = () => { try { return JSON.parse(localStorage.getItem("stw_writing") || "{}"); } catch (e) { return {}; } };
  const lang = () => ({ ja: "j", en: "e", ko: "k" })[twGetLang()];

  function renderList(){
    cur = null;
    const d = drafts(), ck = lang();
    document.getElementById("wrBox").innerHTML = `
      <p style="font-size:14.5px;color:var(--tx2);line-height:1.9;margin-bottom:16px">${twT("wrIntro")}</p>
      ${WRITING.map(t => `
        <div class="wr-topic" onclick="WR.open('${t.id}')">
          <span class="lv">${t.lv.toUpperCase()}</span>
          <h4>${t.title[ck] || t.title.j}</h4>
          ${d[t.id] && d[t.id].length >= t.minLen ? `<span class="done">✓ ${d[t.id].length} ${twT("wrChars")}</span>` : d[t.id] ? `<span class="done" style="color:var(--tx3)">${d[t.id].length} ${twT("wrChars")}</span>` : ""}
        </div>`).join("")}`;
  }

  function open(id){
    cur = WRITING.find(t => t.id === id);
    const ck = lang(), d = drafts();
    document.getElementById("wrBox").innerHTML = `
      <button class="btn" style="margin-bottom:14px" onclick="WR.list()">${twT("wrBack")}</button>
      <h3 style="font-family:var(--serif);font-size:22px;font-weight:700"><span style="font-size:12px;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:1px 8px;vertical-align:middle;margin-right:8px">${cur.lv.toUpperCase()}</span>${cur.title[ck] || cur.title.j}</h3>
      <div class="wr-task">📝 ${cur.task[ck] || cur.task.j}</div>
      <div style="font-size:12px;color:var(--tx3);letter-spacing:.08em;margin-bottom:6px">${twT("wrHints")} ${twT("wrHintTap")}</div>
      <div class="wr-hints">${cur.hints.map(h => `<span class="wr-hint" onclick="WR.hint(this.dataset.z)" data-z="${h.z}">${h.z}<small>${h.py}</small></span>`).join("")}</div>
      <textarea class="wr-ta" id="wrTa" maxlength="3000" placeholder="${twT("wrPlaceholder")}" oninput="WR.onInput()">${d[cur.id] || ""}</textarea>
      <div class="wr-meta">
        <span id="wrCount">${(d[cur.id] || "").length} ${twT("wrChars")}</span>
        <span>${twT("wrMin")}: ${cur.minLen}+</span>
        <span id="wrSaved" style="margin-left:auto;opacity:0;transition:opacity .3s">💾 ${twT("wrSaved")}</span>
      </div>
      <button class="btn primary" id="wrModelBtn" onclick="WR.toggleModel()">📖 ${twT("wrShowModel")}</button>
      <div id="wrModel" style="display:none">
        <div class="wr-model">
          <div style="font-size:12px;color:var(--ac);letter-spacing:.08em;font-weight:700;margin-bottom:8px">${twT("wrModelLabel")}</div>
          <div class="zh" onclick="speakZh(this.textContent)">${cur.model}</div>
          <div class="tr"><b style="color:var(--tx3)">${twT("wrTrLabel")}：</b>${cur.modelTr[ck] || cur.modelTr.j}</div>
        </div>
      </div>`;
  }

  function onInput(){
    const ta = document.getElementById("wrTa");
    document.getElementById("wrCount").textContent = `${ta.value.length} ${twT("wrChars")}`;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const d = drafts();
      d[cur.id] = ta.value.slice(0, 3000); // 念のため上限（localStorage 保護）
      try { localStorage.setItem("stw_writing", JSON.stringify(d)); }
      catch (e) { console.warn("draft save failed (storage full)", e); return; }
      const s = document.getElementById("wrSaved");
      if (s) { s.style.opacity = 1; setTimeout(() => s.style.opacity = 0, 1200); }
    }, 600);
  }

  function hint(z){
    const ta = document.getElementById("wrTa");
    if (ta) { ta.value += z.replace(/～/g, ""); ta.focus(); onInput(); }
    speakZh(z.replace(/～/g, ""));
  }

  // 範文の閲覧は 1日1題まで（同じ題は同日内なら再閲覧無料）
  function openedToday(){
    try { const d = JSON.parse(localStorage.getItem("stw_wr_opened") || "{}");
      return d.date === new Date().toISOString().split("T")[0] ? d.ids || [] : []; } catch (e) { return []; }
  }
  function markOpened(id){
    const ids = openedToday(); if (!ids.includes(id)) ids.push(id);
    localStorage.setItem("stw_wr_opened", JSON.stringify({ date: new Date().toISOString().split("T")[0], ids }));
  }
  function toggleModel(){
    const el = document.getElementById("wrModel"), btn = document.getElementById("wrModelBtn");
    const show = el.style.display === "none";
    if (show && !Paywall.isPremium() && !openedToday().includes(cur.id)) {
      if (!Paywall.gate("writing", () => markOpened(cur.id))) return;
    }
    el.style.display = show ? "" : "none";
    btn.textContent = show ? `📖 ${twT("wrHideModel")}` : `📖 ${twT("wrShowModel")}`;
    if (show) speakZh(cur.model);
  }

  return { render: renderList, list: renderList, open, onInput, hint, toggleModel };
})();

/* ===== 注音 ㄅㄆㄇ ===== */
const ZY = (() => {
  let mode = "table";
  const body = () => document.getElementById("zyBody");
  const GKEY = { initial:"zyGInitial", medial:"zyGMedial", final:"zyGFinal" };

  // 各符号の許容ローマ字（"i / yi" → i, yi ／ ü → u, v も許容）
  function accepts(z){
    const set = new Set();
    z.py.split(/[\s/]+/).filter(Boolean).forEach(p => {
      const t = p.toLowerCase();
      set.add(t); set.add(t.replace(/ü/g,"u")); set.add(t.replace(/ü/g,"v")); set.add(t.replace(/ê/g,"e"));
    });
    return set;
  }

  function render(){
    document.querySelectorAll(".zy-tab").forEach(t => t.classList.toggle("on", t.dataset.zy === mode));
    if (mode === "table") renderTable(); else startTest();
  }
  function renderTable(){
    let html = `<p class="zy-hint">${twT("zyHint")}</p>`;
    for (const g of ["initial","medial","final"]){
      const items = ZHUYIN.filter(z => z.g === g);
      html += `<div class="zy-group"><h4>${twT(GKEY[g])}</h4><div class="zy-grid">` +
        items.map(z => `<button class="zy-cell" onclick="ZY.play(this,'${z.rep}')"><div class="zy-z">${z.z}</div><div class="zy-py">${z.py}</div></button>`).join("") +
        `</div></div>`;
    }
    body().innerHTML = html;
  }
  function play(el, rep){
    document.querySelectorAll(".zy-cell.play").forEach(c => c.classList.remove("play"));
    if (el){ el.classList.add("play"); setTimeout(() => el.classList.remove("play"), 700); }
    TTS.speak(rep);
  }

  // ── テスト（打ち／聴き）──
  let queue = [], qi = 0, correct = 0, locked = false;
  const TOTAL = 15;
  function startTest(){
    // 注音は初学者の土台なので全部無料（テストも）。豊かな無料コンテンツで信頼を、課金価値は深い TOCFL 本編に。
    queue = [...ZHUYIN].sort(() => Math.random()-.5).slice(0, TOTAL);
    qi = 0; correct = 0;
    mode === "type" ? renderType() : renderListen();
  }
  const cur = () => queue[qi];
  const progress = () => `<div class="zy-prog">${qi+1} / ${TOTAL}　✓ ${correct}</div>`;

  function renderType(){
    locked = false;
    const z = cur();
    body().innerHTML = `<div class="zy-test">
      <p class="zy-hint">${twT("zyTypeHint")}</p>
      <div class="zy-prompt">${z.z}</div>
      <button class="zy-play-btn" onclick="ZY.play(null,'${z.rep}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg> ${twT("btnPlay")}</button>
      <div><input class="zy-input" id="zyIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${twT("zyTypePh")}"></div>
      <div class="zy-fb" id="zyFb"></div>
      <div style="margin-top:10px"><button class="btn primary" id="zyGo" onclick="ZY.submitType()">${twT("qzSubmit")}</button></div>
      ${progress()}</div>`;
    const inp = document.getElementById("zyIn");
    inp.focus();
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submitType(); });
    play(null, z.rep);
  }
  function submitType(){
    if (locked){ next(); return; }
    const z = cur(), val = (document.getElementById("zyIn").value || "").trim().toLowerCase().replace(/ü/g,"u");
    const ok = accepts(z).has(val) || accepts(z).has(val.replace(/v/g,"u"));
    const fb = document.getElementById("zyFb");
    if (ok){ correct++; fb.className = "zy-fb ok"; fb.textContent = "✓ " + z.z + " = " + z.py; }
    else { fb.className = "zy-fb ng"; fb.textContent = "✗ " + z.z + " = " + z.py; }
    document.getElementById("zyIn").disabled = true;
    document.getElementById("zyGo").textContent = twT("quizNext");
    locked = true;
  }

  function renderListen(){
    locked = false;
    const z = cur();
    const opts = [z, ...ZHUYIN.filter(x => x.z !== z.z).sort(() => Math.random()-.5).slice(0,3)].sort(() => Math.random()-.5);
    body().innerHTML = `<div class="zy-test">
      <p class="zy-hint">${twT("zyListenHint")}</p>
      <button class="zy-play-btn" onclick="ZY.play(null,'${z.rep}')"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.3 8.7a4.5 4.5 0 0 1 0 6.6"/></svg> ${twT("btnPlay")}</button>
      <div class="zy-opts">${opts.map(o => `<button class="zy-opt" data-z="${o.z}" onclick="ZY.pick(this,'${o.z}','${z.z}')">${o.z}</button>`).join("")}</div>
      <div class="zy-fb" id="zyFb"></div>
      ${progress()}</div>`;
    play(null, z.rep);
  }
  function pick(el, picked, answer){
    if (locked) return;
    locked = true;
    const z = cur();
    const ok = picked === answer;
    if (ok) correct++;
    el.classList.add(ok ? "ok" : "ng");
    if (!ok) document.querySelectorAll(".zy-opt").forEach(o => { if (o.dataset.z === answer) o.classList.add("ok"); });
    const fb = document.getElementById("zyFb");
    fb.className = "zy-fb " + (ok ? "ok" : "ng");
    fb.textContent = (ok ? "✓ " : "✗ ") + z.z + " = " + z.py;
    setTimeout(next, 1100);
  }

  function next(){
    qi++;
    if (qi >= TOTAL){ result(); return; }
    mode === "type" ? renderType() : renderListen();
  }
  function result(){
    body().innerHTML = `<div class="zy-test">
      <div style="font-family:var(--serif);font-size:34px;color:var(--ac);font-weight:700">${correct >= 12 ? twT("zyResGreat") : correct >= 8 ? twT("zyResGood") : twT("zyResTry")}</div>
      <h3 style="font-family:var(--serif);font-size:24px;margin:10px 0">${correct} / ${TOTAL}</h3>
      <div style="margin-top:18px"><button class="btn primary" onclick="ZY.again()">${twT("quizRetry")}</button></div></div>`;
  }
  function again(){ startTest(); }

  document.querySelectorAll(".zy-tab").forEach(t => t.onclick = () => { mode = t.dataset.zy; render(); });

  return { render, play, submitType, pick, again };
})();
