<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご意見・不具合報告 — StayTW Study</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="analytics.js?v=51"></script>
<style>
:root{--bg:#FAF8F3;--bg2:#FFF;--bg3:#F2EEE5;--tx:#1C1C1E;--tx2:#6A6A6A;--tx3:#A9A9A9;--ac:#B8362A;--ac-soft:rgba(184,54,42,.08);--bd:#E5DECF;--line:#DDD5C0;--ease:cubic-bezier(.25,.1,.25,1);--serif:"Hiragino Mincho ProN","Noto Serif JP",serif}
[data-theme="dark"]{--bg:#121113;--bg2:#1B1A1C;--bg3:#1F1E20;--tx:#EDE8DE;--tx2:#8F8A7E;--tx3:#5D5A53;--ac:#E4715F;--ac-soft:rgba(228,113,95,.1);--bd:#2C2A27;--line:#2C2A27}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);line-height:1.8;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:48px 24px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--serif);font-size:26px;margin:18px 0 6px}
.lead{color:var(--tx2);font-size:14.5px;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:700;color:var(--tx2);margin:18px 0 6px}
select,input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit}
textarea{min-height:150px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--ac)}
.btn{margin-top:22px;background:var(--tx);color:var(--bg);border:none;border-radius:999px;padding:13px 32px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ac);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.done{background:var(--ac-soft);border-radius:12px;padding:16px;margin-top:20px;font-size:14.5px;display:none}
.back{font-size:13px;color:var(--tx2);text-decoration:none}
.lang-btn{background:var(--bg3);border:1px solid var(--bd);cursor:pointer;color:var(--tx2);padding:3px 11px;font-size:12px;font-weight:600;border-radius:8px;font-family:inherit}
.hp{position:absolute;left:-9999px;opacity:0}
.hint{font-size:12.5px;color:var(--tx3);margin-top:8px;line-height:1.6}
.hint.err{color:var(--ac);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html" data-i18n="back">← 学習ツールへ戻る</a>
    <button class="lang-btn" id="langBtn" onclick="cycleLang()">日</button>
  </div>
  <h1 data-i18n="title">ご意見・不具合報告</h1>
  <p class="lead" data-i18n="lead">気づいたことがあれば、なんでも気軽に送ってください。内容の誤り報告は特にありがたいです。返信が必要な場合はメールアドレスを添えてください。</p>
  <form id="f">
    <label data-i18n="lblType">種類</label>
    <select name="type">
      <option value="bug" data-i18n="optBug">不具合（動かない・表示がおかしい）</option>
      <option value="content" data-i18n="optContent">内容の誤り（単語・訳・音声など）</option>
      <option value="feature" data-i18n="optFeature">機能の要望</option>
      <option value="other" selected data-i18n="optOther">その他・感想</option>
    </select>
    <label data-i18n="lblMsg">内容 *</label>
    <textarea name="message" required minlength="10" data-i18n-ph="phMsg" placeholder="例：Level 2 の「颱風」の例文の日本語訳が不自然です／模試の結果画面で…"></textarea>
    <div class="hint" id="hint" data-i18n="hintMsg">できるだけ具体的にお願いします 🙏</div>
    <label data-i18n="lblEmail">メールアドレス（必須）</label>
    <input id="femail" name="email" type="email" required placeholder="you@example.com">
    <div class="hint" id="emailNote" style="display:none"></div>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <button class="btn" type="submit" data-i18n="btnSend">送信する</button>
    <div class="done" id="done" data-i18n="doneMsg">✅ 送信しました。ありがとうございます！</div>
  </form>
</div>
<script>
const T = {
  zh:{ back:"← 回學習工具", title:"意見・問題回報",
    lead:"發現任何問題都歡迎隨時告訴我們，特別感謝內容錯誤的回報。若需要回覆，請留下 email。",
    lblType:"類型", optBug:"問題（無法運作／顯示異常）", optContent:"內容錯誤（單字・翻譯・語音等）", optFeature:"功能建議", optOther:"其他・心得",
    lblMsg:"內容 *", phMsg:"例：Level 2「颱風」的例句翻譯怪怪的／模擬考結果畫面…", lblEmail:"Email（必填）", emailLogged:"使用你登入的信箱", emailNeed:"請填寫 Email",
    hintMsg:"請盡量具體 🙏 寫出「哪個畫面／等級」「做了什麼」「結果怎樣（期待 vs 實際）」，我們能更快修好。", tooShort:"再多描述一點點（至少 10 個字）", btnSend:"送出", sending:"送出中…", doneMsg:"✅ 已送出，謝謝你！", err:"送出失敗 — 請再試一次" },
  ja:{ back:"← 学習ツールへ戻る", title:"ご意見・不具合報告",
    lead:"気づいたことがあれば、なんでも気軽に送ってください。内容の誤り報告は特にありがたいです。返信が必要な場合はメールアドレスを添えてください。",
    lblType:"種類", optBug:"不具合（動かない・表示がおかしい）", optContent:"内容の誤り（単語・訳・音声など）", optFeature:"機能の要望", optOther:"その他・感想",
    lblMsg:"内容 *", phMsg:"例：Level 2 の「颱風」の例文の日本語訳が不自然です／模試の結果画面で…", lblEmail:"メールアドレス（必須）", emailLogged:"ログイン中のメールを使用します", emailNeed:"メールアドレスを入力してください",
    hintMsg:"できるだけ具体的にお願いします 🙏「どの画面・レベル」「何をしたとき」「どうなった（期待と実際）」があると、すぐ直せます。", tooShort:"もう少し詳しく教えてください（10文字以上）", btnSend:"送信する", sending:"送信中…", doneMsg:"✅ 送信しました。ありがとうございます！", err:"送信できませんでした — もう一度" },
  en:{ back:"← Back to study tools", title:"Feedback & Bug Report",
    lead:"Spotted something? Send it over — anything is welcome. Reports of content errors are especially appreciated. Add your email if you'd like a reply.",
    lblType:"Type", optBug:"Bug (not working / looks off)", optContent:"Content error (word, translation, audio…)", optFeature:"Feature request", optOther:"Other / thoughts",
    lblMsg:"Message *", phMsg:"e.g. The example sentence for 颱風 in Level 2 reads unnaturally / On the mock-exam results screen…", lblEmail:"Email (required)", emailLogged:"Using your signed-in email", emailNeed:"Please enter your email",
    hintMsg:"Please be as specific as you can 🙏 Which screen/level, what you did, and what happened (expected vs actual) helps us fix it fast.", tooShort:"Please add a little more detail (at least 10 characters).", btnSend:"Send", sending:"Sending…", doneMsg:"✅ Sent — thank you!", err:"Couldn't send — try again" },
  ko:{ back:"← 학습 도구로 돌아가기", title:"의견·오류 신고",
    lead:"발견하신 점이 있으면 무엇이든 편하게 보내 주세요. 특히 내용 오류 제보가 큰 도움이 됩니다. 답장이 필요하면 이메일을 남겨 주세요.",
    lblType:"종류", optBug:"오류 (작동 안 함 / 표시 이상)", optContent:"내용 오류 (단어·번역·음성 등)", optFeature:"기능 요청", optOther:"기타 / 감상",
    lblMsg:"내용 *", phMsg:"예: Level 2 「颱風」 예문의 번역이 어색해요 / 모의고사 결과 화면에서…", lblEmail:"이메일 (필수)", emailLogged:"로그인된 이메일을 사용합니다", emailNeed:"이메일을 입력해 주세요",
    hintMsg:"가능한 한 구체적으로 적어 주세요 🙏 어느 화면·레벨에서, 무엇을 했을 때, 어떻게 됐는지(기대 vs 실제) 알려 주시면 빠르게 고칠 수 있어요.", tooShort:"조금만 더 자세히 적어 주세요 (10자 이상).", btnSend:"보내기", sending:"보내는 중…", doneMsg:"✅ 보냈습니다 — 감사합니다!", err:"보내지 못했습니다 — 다시 시도" }
};
function pickLang(){
  var q=(new URLSearchParams(location.search)).get("lang");
  if(q){q=q.toLowerCase(); if(q.indexOf("zh")===0||q==="tw")return"zh"; if(T[q])return q;}
  var s=localStorage.getItem("stw-lang"); return (s&&T[s])?s:"ja";
}
let LANG = pickLang();
function applyLang(){
  const d = T[LANG] || T.ja;
  document.documentElement.lang = LANG;
  document.getElementById("langBtn").textContent = {zh:"中",ja:"日",en:"EN",ko:"한"}[LANG];
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=d[el.dataset.i18n]; if(v!=null) el.textContent=v; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ const v=d[el.dataset.i18nPh]; if(v!=null) el.placeholder=v; });
}
function cycleLang(){ LANG = {ja:"en",en:"ko",ko:"ja"}[LANG]; localStorage.setItem("stw-lang",LANG); applyLang(); }
(function(){
  const s=localStorage.getItem("stw-theme");
  if(s==="dark"||(!s&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark";
  applyLang();
})();
// ログイン中なら登入 email を自動使用（Apple の非公開メール=relay も含む）。編集不可にして確実に取得。
function prefillEmail(){
  const d=T[LANG]||T.ja, fe=document.getElementById("femail"), note=document.getElementById("emailNote");
  let email="";
  try{ const u=JSON.parse(localStorage.getItem("stw_user")||"null"); email=(u&&u.email)||""; }catch(e){}
  if(email){ fe.value=email; fe.readOnly=true; fe.style.opacity=".7";
    if(note){ note.textContent=d.emailLogged; note.style.display="block"; } }
}
prefillEmail();
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const f=e.target, btn=f.querySelector(".btn"), d=T[LANG]||T.ja;
  const hint=document.getElementById("hint");
  const msg=(f.message.value||"").trim();
  if(msg.length<10){ hint.textContent=d.tooShort; hint.classList.add("err"); f.message.focus(); return; }
  const em=(f.email.value||"").trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ hint.textContent=d.emailNeed; hint.classList.add("err"); f.email.focus(); return; }
  hint.classList.remove("err"); hint.textContent=d.hintMsg;
  btn.disabled=true; btn.textContent=d.sending;
  try{
    const r=await fetch("/api/feedback",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:f.type.value,message:f.message.value,email:f.email.value,
        website:f.website.value,lang:LANG})});
    if(!r.ok) throw new Error("send failed");
    document.getElementById("done").style.display="block";
    f.message.value=""; btn.textContent=d.btnSend; btn.disabled=false;
  }catch(err){ btn.textContent=d.err; btn.disabled=false; }
});
</script>
<script>try{fetch("/api/hit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:location.pathname,ref:document.referrer,app:!!(window.STAYTW_NATIVE&&window.STAYTW_NATIVE.isNativeApp)})})}catch(e){}</script>
<script src="inapp-hint.js?v=1"></script>
</body>
</html>
