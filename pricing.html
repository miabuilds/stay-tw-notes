<style>
:root{--bg:#FAF8F3;--bg2:#FFFFFF;--tx:#1C1C1E;--tx2:#6A6A6A;--tx3:#9A948A;--ac:#B8362A;--line:#DDD5C0}
@media(prefers-color-scheme:dark){:root{--bg:#121113;--bg2:#1B1A1C;--tx:#EDE8DE;--tx2:#8F8A7E;--tx3:#6a655c;--line:#33302c}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Hiragino Sans","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 80px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.top .logo{width:40px;height:40px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px}
.top b{font-size:18px}
.langs{margin-left:auto;display:flex;gap:6px}
.langs button{border:1px solid var(--line);background:var(--bg2);color:var(--tx2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.langs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h1{font-size:30px;font-weight:800;margin:26px 0 6px;letter-spacing:.5px}
.lead{color:var(--tx2);font-size:15px;margin-bottom:24px}
.free{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:26px}
.free h3{font-size:16px;margin-bottom:6px}
.free p{color:var(--tx2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.plan{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--ac)}
.tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 12px;white-space:nowrap}
.pname{font-size:15px;font-weight:700;margin-bottom:10px}
.price{font-size:32px;font-weight:800;line-height:1}
.price .cur{font-size:16px;color:var(--tx2);margin-right:2px}
.price .unit{font-size:14px;font-weight:600;color:var(--tx2);margin-left:3px}
.cycle{color:var(--tx3);font-size:12.5px;margin:6px 0 14px;min-height:18px}
.plan ul{list-style:none;margin:0 0 18px;font-size:13.5px;color:var(--tx2)}
.plan ul li{padding:4px 0 4px 20px;position:relative}
.plan ul li::before{content:"✓";position:absolute;left:0;color:var(--ac);font-weight:800}
.cta{margin-top:auto;text-align:center;background:var(--ac);color:#fff;font-weight:700;border-radius:999px;padding:12px;font-size:15px;cursor:pointer;border:none;width:100%;font-family:inherit}
.cta.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.feat{margin-top:34px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.feat h3{font-size:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.frow{display:flex;justify-content:space-between;gap:12px;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow .v{color:var(--tx2);white-space:nowrap;text-align:right}
.frow .v.paid{color:var(--ac);font-weight:700}
.rules{margin-top:30px;font-size:13px;color:var(--tx2)}
.rules h3{font-size:15px;color:var(--tx);margin-bottom:8px}
.rules li{margin:4px 0 4px 18px}
.links{margin-top:24px;font-size:13.5px}
.links a{color:var(--ac);text-decoration:none;margin-right:16px;white-space:nowrap}
footer{margin-top:36px;font-size:12.5px;color:var(--tx3);border-top:1px solid var(--line);padding-top:18px}
footer a{color:var(--tx2)}
</style>
</head>

function pick(){
  var q=(new URLSearchParams(location.search)).get('lang');
  if(q){q=q.toLowerCase(); if(q.indexOf('zh')===0||q==='tw')return'zh'; if(T[q])return q;}
  var s=(function(){try{return localStorage.getItem('stw-lang')}catch(e){return null}})();
  if(s&&T[s])return s;
  return 'zh'; // 預設繁中/NT$（金流審核情境）
}
var lang=pick();

function render(){
  var t=T[lang], c=CUR[lang];
  document.documentElement.lang=lang==='zh'?'zh-Hant':lang;
  var _b=document.getElementById('backTxt'); if(_b)_b.textContent=({zh:'返回',ja:'戻る',en:'Back',ko:'뒤로'})[lang]||'返回';
  // langs
  document.getElementById('langs').innerHTML=Object.keys(T).map(function(k){
    return '<button data-l="'+k+'" class="'+(k===lang?'on':'')+'">'+T[k].name+'</button>';}).join('');
  document.querySelectorAll('#langs button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;try{if(lang!=='zh')localStorage.setItem('stw-lang',lang)}catch(e){} render();};});
  document.getElementById('h1').textContent=t.title;
  document.getElementById('lead').textContent=t.lead;
  document.getElementById('freeH').textContent=t.freeH;
  document.getElementById('freeP').textContent=t.freeP;
  var P=function(v){return '<span class="cur">'+c.sym+'</span>'+v;};
  document.getElementById('grid').innerHTML=
   plan('monthly',t.mN,P(c.m),'<span class="unit">/ '+({ja:'月',zh:'月',en:'mo',ko:'월'}[lang])+'</span>',t.mC,t.f1,t.cta1,'ghost','')+
   plan('yearly',t.yN,P(c.y),'<span class="unit">/ '+({ja:'年',zh:'年',en:'yr',ko:'년'}[lang])+'</span>',t.yC(c.pm),t.f2,t.cta2,'',t.best)+
   plan('lifetime',t.lN,P(c.l),'',t.lC,t.f3,t.cta3,'ghost','');
  document.getElementById('featH').textContent=t.featH;
  document.getElementById('featBody').innerHTML=t.rows.map(function(r){
    return '<div class="frow"><span class="k">'+r[0]+'</span><span class="v'+(r[2]?' paid':'')+'">'+r[1]+'</span></div>';}).join('');
  document.getElementById('rulesH').textContent=t.rulesH;
  document.getElementById('rulesBody').innerHTML=t.rules.map(function(x){return '<li>'+x+'</li>';}).join('');
  var q='?lang='+lang;
  document.getElementById('links').innerHTML=
    '<a href="/terms'+q+'">'+t.lTerms+'</a><a href="/refund'+q+'">'+t.lRefund+'</a><a href="/privacy'+q+'">'+t.lPriv+'</a><a href="/contact'+q+'">'+t.lContact+'</a>';
  document.getElementById('foot').innerHTML=t.foot+'<br>'+({ja:'お問い合わせ',zh:'客服信箱',en:'Contact',ko:'문의'}[lang])+'：<a href="mailto:stayjpplan@gmail.com">stayjpplan@gmail.com</a>';
}
function plan(id,name,price,unit,cycle,feats,cta,cls,tag){
  return '<div class="plan'+(tag?' hot':'')+'" data-plan="'+id+'">'+(tag?'<div class="tag">'+tag+'</div>':'')+
    '<div class="pname">'+name+'</div><div class="price">'+price+unit+'</div><div class="cycle">'+cycle+'</div>'+
    '<ul>'+feats.map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul>'+
    '<button class="cta '+cls+'" onclick="return startSubscribe(this)">'+cta+'</button></div>';
}
render();

//    不可導向外部金流。偵測到在 App 內 → 整頁清成中性 placeholder 並自動開原生付費牆，
//    移除所有外部金流字眼與價格（反導流合規）。
function stwBack(){ if(history.length>1){ history.back(); } else { location.href="index.html"; } }
function stwScrubPricing(){
  try{
    if(!(window.STAYTW_NATIVE && window.STAYTW_NATIVE.isNativeApp)) return;
    var main=document.querySelector('main.wrap');
    if(!main) return;
    main.innerHTML='<div id="iapGo" style="max-width:480px;margin:90px auto;text-align:center;color:var(--tx2);cursor:pointer">…</div>';
    function iapOpen(){try{if(!(window.ReactNativeWebView && window.ReactNativeWebView.postMessage))return;var lng=(function(){try{return localStorage.getItem('stw-lang')}catch(e){return null}})()||'ja';window.ReactNativeWebView.postMessage(JSON.stringify({type:'OPEN_PAYWALL',lang:lng}));}catch(_){}}
    var g=document.getElementById('iapGo'); if(g)g.onclick=iapOpen; iapOpen();
  }catch(_){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',stwScrubPricing);else stwScrubPricing();

// ── 點「訂閱／買斷」
function startSubscribe(btn){
  var card=btn.closest('.plan'), plan=card&&card.dataset.plan;
  if(!plan)return false;
  // 原生 App：一律通知原生開內購付費牆，絕不走網頁金流（Apple/Google 合規）
  if(window.STAYTW_NATIVE && window.STAYTW_NATIVE.isNativeApp){
    try{if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){var lng=(function(){try{return localStorage.getItem('stw-lang')}catch(e){return null}})()||'ja';window.ReactNativeWebView.postMessage(JSON.stringify({type:'OPEN_PAYWALL',plan:plan,lang:lng}));}}catch(_){}
    return false;
  }
  // 一般瀏覽器：走統一金流 PayUni。
  // TODO(PayUni): 商店審核通過後，改為 POST /api/payuni/create-order → 導向回傳的付款網址。
  try{localStorage.setItem('stw_pending_plan',plan);}catch(_){}
  showNotice(); return false;
}
function showNotice(){
