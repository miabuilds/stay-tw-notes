<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>闖關モード 試作 — StayTW</title>
<style>
:root{--bg:#FAF8F3;--bg2:#FFF;--bg3:#F2EEE5;--tx:#1C1C1E;--tx2:#6A6A6A;--tx3:#A9A9A9;
 --ac:#B8362A;--ac-soft:rgba(184,54,42,.08);--bd:#E5DECF;--line:#DDD5C0;
 --serif:"Hiragino Mincho ProN","Noto Serif JP","Songti TC",serif}
@media(prefers-color-scheme:dark){:root{--bg:#121113;--bg2:#1B1A1C;--bg3:#1F1E20;--tx:#EDE8DE;
 --tx2:#8F8A7E;--tx3:#5D5A53;--ac:#E4715F;--ac-soft:rgba(228,113,95,.1);--bd:#2C2A27;--line:#2C2A27}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.7 -apple-system,"Hiragino Sans","Noto Sans TC",sans-serif;
 -webkit-font-smoothing:antialiased;padding-bottom:40px}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
.note{background:var(--ac-soft);border:1px solid var(--ac);color:var(--ac);border-radius:12px;
 padding:11px 14px;font-size:12.5px;line-height:1.75;margin:14px 0 18px}
h1.t{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.01em;padding:24px 0 4px}

/* 軌道タブ:今は「更多」の引き出しに 18 個入っているものを 3 本にまとめる案 */
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 20px}
.levels button{border:1px solid var(--bd);background:var(--bg2);border-radius:10px;padding:9px 2px;
 font:inherit;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer}
.levels button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tracks{display:flex;gap:4px;background:var(--bg3);border-radius:999px;padding:4px;margin:14px 0 20px}
.tracks button{flex:1;border:0;background:none;font:inherit;font-size:14.5px;font-weight:600;color:var(--tx2);
 padding:10px 4px;border-radius:999px;cursor:pointer}
.tracks button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 次の 1 課(hero)。道具名ではなく、これから出てくる“中身”を見せる */
.hero{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:26px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.hero-unit{color:var(--ac);font-weight:700}
.hero-n{color:var(--tx3)}
.hero-z{font-size:27px;line-height:1.55;margin:14px 0 4px;font-weight:600;letter-spacing:.01em}
.hero-z em{color:var(--ac);font-style:normal}
.hero-m{color:var(--tx2);font-size:14px}
.hero-bar{height:5px;background:var(--line);border-radius:3px;margin:16px 0 6px;overflow:hidden}
.hero-bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.hero-c{display:flex;justify-content:flex-end;font-size:12.5px;color:var(--tx3);margin-bottom:14px}
.cta{display:block;width:100%;border:0;border-radius:14px;background:var(--tx);color:var(--bg);
 font:inherit;font-size:16px;font-weight:700;padding:15px;cursor:pointer}
.cta:active{transform:scale(.99)}

.uhead{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.uhead b{font-size:14px;font-weight:700;letter-spacing:.04em}
.uhead i{flex:1;height:1px;background:var(--line)}
.uhead span{font-size:13px;color:var(--tx3)}

.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);
 border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer}
.lesson[disabled]{opacity:.45;cursor:default}
.lesson .dot{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
 background:var(--bg3);color:var(--tx2);font-weight:700;font-size:15px}
.lesson.now .dot{background:var(--tx);color:var(--bg)}
.lesson.done .dot{background:var(--ac);color:#fff}
.lesson .mid{flex:1;min-width:0}
.lesson .nm{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .pv{font-size:12.5px;color:var(--tx3);margin-top:3px}
.lesson .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.lesson .bar i{display:block;height:100%;background:var(--ac)}
.lesson .n{font-size:13.5px;font-weight:700;color:var(--ac);flex:none}

/* 課の中 */
#play{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;overflow:auto}
#play.on{display:block}
.pbar{display:flex;align-items:center;gap:12px;padding:16px 18px 0;max-width:520px;margin:0 auto}
.pbar .x{border:0;background:none;font-size:22px;color:var(--tx3);cursor:pointer;line-height:1}
.pbar .pg{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar .pg i{display:block;height:100%;background:var(--ac);transition:width .25s}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:40px 20px;text-align:center;margin:26px 0 18px}
.card .w{font-size:62px;font-weight:700;line-height:1.25}
.card .zy{color:var(--ac);font-size:19px;margin-top:8px;letter-spacing:.08em}
.card .py{color:var(--tx3);font-size:15px;margin-top:2px}
.card .m{font-size:18px;margin-top:16px}
.card .ex{color:var(--tx2);font-size:14.5px;margin-top:16px;line-height:1.9;border-top:1px dashed var(--line);padding-top:14px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{padding:15px 16px;border:1px solid var(--bd);border-radius:13px;background:var(--bg2);color:var(--tx);
 font:inherit;font-size:15.5px;text-align:left;cursor:pointer}
.opt.ok{border-color:#3F7D53;background:rgba(63,125,83,.1);font-weight:700}
.opt.ng{border-color:var(--ac);background:var(--ac-soft)}
.opt:disabled{cursor:default}
.qz-w{font-size:46px;font-weight:700;text-align:center;margin:30px 0 4px}
.qz-zy{text-align:center;color:var(--ac);letter-spacing:.08em;margin-bottom:8px}
.done-w{text-align:center;padding:60px 0}
.done-w .big{font-size:46px;font-weight:800;color:var(--ac)}
.done-w p{color:var(--tx2);margin:10px 0 26px}
.sec{display:none}.sec.on{display:block}

/* ── 終点の手応え ──
   前の試作は「8/8 完了」の 4 文字で終わっていて、何も残らなかった。
   ここで動かすのは 3 つだけ:点数が数え上がる / 単元の進度条がその場で伸びる / 次の課が開く。 */
.fin{padding:36px 0 20px;text-align:center}
.fin-ring{width:132px;height:132px;margin:0 auto 6px;position:relative}
.fin-ring svg{transform:rotate(-90deg)}
.fin-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
.fin-ttl{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:8px}
.fin-sub{color:var(--tx2);font-size:13.5px;margin-top:4px}
.fin-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--bd);
 border-radius:14px;padding:13px 15px;margin:22px 0 10px;text-align:left;opacity:0;transform:translateY(8px);
 transition:opacity .45s ease,transform .45s ease}
.fin-row.in{opacity:1;transform:none}
.fin-row .k{font-size:13px;color:var(--tx2);flex:1}
.fin-row .v{font-weight:800;color:var(--ac)}
.fin-ubar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.fin-ubar i{display:block;height:100%;background:var(--ac);border-radius:4px;width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
.unlock{border:1px dashed var(--ac);background:var(--ac-soft);border-radius:14px;padding:14px 15px;
 margin:14px 0 20px;text-align:left;opacity:0;transform:translateY(8px);transition:opacity .45s ease .25s,transform .45s ease .25s}
.unlock.in{opacity:1;transform:none}
.unlock b{display:block;font-size:12px;color:var(--ac);letter-spacing:.06em}
.unlock span{font-size:15px;font-weight:600}
.retry{display:inline-block;font-size:12px;color:var(--ac);background:var(--ac-soft);
 border-radius:999px;padding:3px 10px;margin-bottom:10px}
.qhint{text-align:center;color:var(--tx3);font-size:12.5px;letter-spacing:.06em;margin-top:26px}
.qbig{font-size:52px;font-weight:700;text-align:center;margin:10px 0 2px;line-height:1.2}
.qmid{font-size:26px;font-weight:600;text-align:center;margin:10px 0 2px}
.qzy{text-align:center;color:var(--ac);letter-spacing:.1em;margin-bottom:6px}
.qcloze{font-size:24px;line-height:1.9;text-align:center;margin:14px 0 4px}
.qcloze b{color:var(--ac);border-bottom:2px solid var(--ac);padding:0 14px}
.spk{display:block;margin:18px auto 0;width:92px;height:92px;border-radius:50%;border:1px solid var(--bd);
 background:var(--bg2);cursor:pointer;font-size:34px;color:var(--ac)}
.spk:active{transform:scale(.96)}
</style></head>
<body>
<div class="wrap" id="home">
  <h1 class="t">闖關モード <span style="font-size:15px;color:var(--tx3)">試作</span></h1>
  <div class="note">
    これは<b>試作ページ</b>です。今の app には繋いでいません。<br>
    変えたのは 2 点だけ ——(1) 関が「道具」ではなく<b>中身</b>になっている (2) 分母が 441 ではなく <b>8</b>。<br>
    単語は本物のデータ、単元は vocab-l1.js のテーマコメントから機械的に作っています。
  </div>
  <div class="tracks">
    <button>注音</button><button class="on">単語</button><button>文法</button>
  </div>
  <div class="levels" id="levels"></div>
  <div id="hero"></div>
  <div id="units"></div>
</div>

<div id="play">
 <div class="wrap">
  <div class="pbar"><button class="x" onclick="P.quit()">✕</button><div class="pg"><i id="pgi" style="width:0"></i></div><span id="pgt" style="font-size:12.5px;color:var(--tx3)"></span></div>
  <div id="stage"></div>
 </div>
</div>

<script src="tts.js?v=64"></script>
<script src="vocab-l1.js"></script>
<script src="vocab-l1-b.js"></script>
<script src="vocab-l1-c.js"></script>
<script src="vocab-l2.js"></script>
<script src="vocab-l2-b.js"></script>
<script src="vocab-l2-c.js"></script>
<script src="vocab-l3.js"></script>
<script src="vocab-l3-b.js"></script>
<script src="vocab-l3-c.js"></script>
<script src="vocab-l4.js"></script>
<script src="vocab-l4-b.js"></script>
<script src="vocab-l4-c.js"></script>
<script src="vocab-l5.js"></script>
<script src="vocab-l5-b.js"></script>
<script src="vocab-l5-c.js"></script>
<script src="vocab-l6.js"></script>
<script src="vocab-l6-b.js"></script>
<script src="vocab-l6-c.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const LANG = (new URLSearchParams(location.search).get("lang")) || "ja";
const MK = {ja:"j", en:"e", ko:"k", vi:"vi", id:"id"}[LANG] || "j";
const WORDS = {};
const mean = (v) => (v && v.m && (v.m[MK] || v.m.e || v.m.j)) || "";
const exOf = (v) => (v && v.ex) || null;

let DATA = null;
const KEYBASE = "stw_proto_lessons";
const KEY_ = () => KEYBASE + ":" + LV;
const state = () => { try { return JSON.parse(localStorage.getItem(KEY_())) || {}; } catch(e){ return {}; } };
const setDone = (k) => { const s = state(); s[k] = 1; localStorage.setItem(KEY_(), JSON.stringify(s)); };

function flat(){
  const out = [];
  DATA.units.forEach((u, ui) => u.lessons.forEach((l, li) =>
    out.push({ key: "u"+u.no+":"+li, ui, li, unit: u, lesson: l,
               title: nm(l.name) + (l.idx ? " " + l.idx : ""),
               ws: l.words.filter(w => WORDS[w]) })));
  return out;
}
const nm = (o) => (o && (o[LANG] || o.ja || o.en)) || "";
function nextLesson(){ const s = state(); return flat().find(l => !s[l.key]) || null; }

function renderHome(){
  const st = state(), nx = nextLesson();
  if (nx){
    const v = WORDS[nx.ws[0]], ex = exOf(v);
    const z = ex ? esc(ex.z).replace(esc(v.w), `<em>${esc(v.w)}</em>`) : `<em>${esc(v.w)}</em>`;
    const tr = ex ? (ex[MK] || ex.e || ex.j) : mean(v);
    $("hero").innerHTML = `
      <div class="hero">
        <div class="hero-top"><span class="hero-unit">第 ${nx.unit.no} 単元 · ${esc(nx.title)}</span>
          <span class="hero-n">第 ${nx.li+1} / ${nx.unit.lessons.length} 課</span></div>
        <div class="hero-z">${z}</div>
        <div class="hero-m">${esc(tr)}</div>
        <div class="hero-bar"><i style="width:0%"></i></div>
        <div class="hero-c">0 / ${nx.ws.length}</div>
        <button class="cta" onclick="P.start('${nx.key}')">▷ この課をはじめる</button>
      </div>`;
  } else {
    $("hero").innerHTML = `<div class="hero"><div class="hero-z">この級はぜんぶ終わりました</div>
      <button class="cta" onclick="P.reset()">最初からやり直す</button></div>`;
  }
  const all = flat();
  $("units").innerHTML = DATA.units.map((u) => {
    const mine = all.filter((x) => x.unit.no === u.no);
    const doneN = mine.filter((x) => st[x.key]).length;
    const rows = mine.map((x) => {
      const done = !!st[x.key], isNow = nx && nx.key === x.key;
      return `<button class="lesson ${done?"done":""} ${isNow?"now":""}" onclick="P.start('${x.key}')">
        <span class="dot">${done ? "✓" : (isNow ? "▶" : x.li+1)}</span>
        <span class="mid">
          <span class="nm">${esc(x.title)}</span>
          <span class="pv">${esc(x.ws.slice(0,4).join("・"))}…</span>
          <span class="bar"><i style="width:${done?100:0}%"></i></span>
        </span>
        <span class="n">${done?x.ws.length:0}/${x.ws.length}</span>
      </button>`;
    }).join("");
    return `<div class="uhead"><b>第 ${u.no} 単元 · ${esc(nm(u.lead))}</b><i></i><span>${doneN}/${mine.length}</span></div>${rows}`;
  }).join("");
}

// ── 1 課の中身 ────────────────────────────────────────────
// 前の試作:カード 8 枚 → 4 択 8 問。同じ動作の繰り返しで、終わっても何も残らなかった。
// ここでやること:
//   ・出題を 5 種類まぜる(意味/逆引き/注音/穴うめ/聞き取り)。同じ語でも違う角度で 2 回出る
//   ・間違えた語はその場で捨てずに、後ろに積んで必ずもう一度出す(落第させない)
//   ・終わりに「点数が数え上がる → 単元の進度条が伸びる → 次の課が開く」を順に見せる
const P = (() => {
  let L = null, queue = [], idx = 0, score = 0, asked = 0, wrongSet = null;
  const shuf = (a) => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; };
  const pool = () => Object.keys(WORDS);

  function distract(fn, not, n){
    const out = [];
    for (const w of shuf(pool())) {
      if (w === not) continue;
      const v = fn(WORDS[w]);
      if (!v || out.includes(v)) continue;
      out.push(v); if (out.length >= n) break;
    }
    return out;
  }
  function mkQ(w, kind){
    const v = WORDS[w], ex = exOf(v);
    if (kind === "cloze" && ex && ex.z.indexOf(v.w) >= 0)
      return { kind, w, ans: v.w, opts: shuf([v.w, ...distract(x=>x.w, w, 3)]) };
    if (kind === "zhuyin" && v.zy)
      return { kind, w, ans: v.zy, opts: shuf([v.zy, ...distract(x=>x.zy, w, 3)]) };
    if (kind === "reverse")
      return { kind, w, ans: v.w, opts: shuf([v.w, ...distract(x=>x.w, w, 3)]) };
    if (kind === "listen")
      return { kind, w, ans: v.w, opts: shuf([v.w, ...distract(x=>x.w, w, 3)]) };
    return { kind: "meaning", w, ans: mean(v), opts: shuf([mean(v), ...distract(x=>mean(x), w, 3)]) };
  }

  function start(key){
    L = flat().find(x => x.key === key); if (!L) return;
    score = 0; asked = 0; idx = 0; wrongSet = new Set();
    const ws = L.ws;
    // 先に全部 1 回見せる → そのあと角度を変えて 2 周。1 周目は易しい型、2 周目は難しい型。
    // 24 問(2 周)にしたら長すぎて、終わる前に飽きた。1 周 8 問のまま“型を散らす”。
    // 同じ 4 択でも、意味・逆引き・注音・穴うめ・聞き取りが混ざると体感がまったく違う。
    const kinds = shuf(["meaning", "reverse", "zhuyin", "cloze", "listen", "meaning", "reverse", "cloze"]);
    queue = ws.map(w => ({ kind: "learn", w }));
    shuf(ws).forEach((w, i) => queue.push(mkQ(w, kinds[i % kinds.length])));
    $("play").classList.add("on"); draw();
  }
  function quit(){ $("play").classList.remove("on"); renderHome(); }
  function reset(){ localStorage.removeItem(KEY_()); renderHome(); }

  function prog(){
    const pct = Math.min(100, Math.round(idx / queue.length * 100));
    $("pgi").style.width = pct + "%";
    $("pgt").textContent = idx < queue.length ? (idx+1) + " / " + queue.length : "";
  }
  function speak(w){ try { speakZh(w); } catch(e){} }

  function draw(){
    if (idx >= queue.length) { finish(); return; }
    prog();
    const q = queue[idx], v = WORDS[q.w], ex = exOf(v);
    const again = q.again ? `<div style="text-align:center"><span class="retry">もう一度</span></div>` : "";
    if (q.kind === "learn"){
      $("stage").innerHTML = `
        <div class="card">
          <div class="w" onclick="P.say('${esc(v.w)}')">${esc(v.w)}</div>
          <div class="zy">${esc(v.zy||"")}</div><div class="py">${esc(v.py||"")}</div>
          <div class="m">${esc(mean(v))}</div>
          ${ex ? `<div class="ex">${esc(ex.z)}<br>${esc(ex[MK]||ex.e||ex.j)}</div>` : ""}
        </div>
        <button class="cta" onclick="P.next()">${idx+1 < L.ws.length ? "次へ" : "おぼえた → 確認"}</button>`;
      speak(v.w);
      return;
    }
    let head;
    if (q.kind === "meaning")      head = `<div class="qhint">意味は?</div><div class="qbig" onclick="P.say('${esc(v.w)}')">${esc(v.w)}</div><div class="qzy">${esc(v.zy||"")}</div>`;
    else if (q.kind === "reverse") head = `<div class="qhint">どの語?</div><div class="qmid">${esc(mean(v))}</div>`;
    else if (q.kind === "zhuyin")  head = `<div class="qhint">読み方は?</div><div class="qbig">${esc(v.w)}</div>`;
    else if (q.kind === "listen")  head = `<div class="qhint">聞こえたのは?</div><button class="spk" onclick="P.say('${esc(v.w)}')">♪</button>`;
    else                           head = `<div class="qhint">空いているのは?</div><div class="qcloze">${esc(ex.z).replace(esc(v.w), "<b>　</b>")}</div>`;
    $("stage").innerHTML = again + head +
      `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="P.pick(${i})">${esc(o)}</button>`).join("")}</div><div id="after"></div>`;
    if (q.kind === "listen") speak(v.w);
  }
  function next(){ idx++; draw(); }
  function say(w){ speak(w); }

  function pick(i){
    const q = queue[idx], v = WORDS[q.w], ok = q.opts[i] === q.ans;
    asked++; if (ok) score++; else wrongSet.add(q.w);
    document.querySelectorAll(".opt").forEach((b,n)=>{ b.disabled = true;
      if (q.opts[n] === q.ans) b.classList.add("ok"); else if (n===i) b.classList.add("ng"); });
    // 落第させない:間違えた語は後ろに積んで必ずもう一度出す
    if (!ok) queue.push(Object.assign(mkQ(q.w, "meaning"), { again: true }));
    const ex = exOf(v);
    $("after").innerHTML = `
      <div class="card" style="padding:18px 16px;margin:16px 0 0;text-align:left">
        <div style="font-size:22px;font-weight:700">${esc(v.w)} <span style="color:var(--ac);font-size:15px;letter-spacing:.08em">${esc(v.zy||"")}</span></div>
        <div style="color:var(--tx2);font-size:14px;margin-top:2px">${esc(mean(v))}</div>
        ${ex ? `<div style="color:var(--tx2);font-size:13.5px;margin-top:8px;line-height:1.85">${esc(ex.z)}</div>` : ""}
      </div>
      <button class="cta" style="margin-top:14px" onclick="P.next()">${idx+1 < queue.length ? "次へ" : "結果"}</button>`;
  }

  // ── 終わり:順番に見せる。全部いっぺんに出すと何も印象に残らない ──
  function finish(){
    setDone(L.key);
    $("pgi").style.width = "100%"; $("pgt").textContent = "";
    const s = state();
    const mine = flat().filter((x) => x.unit.no === L.unit.no);
    const doneN = mine.filter((x) => s[x.key]).length;
    const before = Math.round((doneN-1) / mine.length * 100), after = Math.round(doneN / mine.length * 100);
    const nx = nextLesson();
    const pct = asked ? Math.round(score/asked*100) : 100;
    const R = 60, C = 2*Math.PI*R;
    $("stage").innerHTML = `
      <div class="fin">
        <div class="fin-ring">
          <svg width="132" height="132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="9"/>
            <circle id="ring" cx="66" cy="66" r="${R}" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)"/></svg>
          <div class="val" id="ringv">0%</div>
        </div>
        <div class="fin-ttl">${esc(L.title)} クリア</div>
        <div class="fin-sub">${L.ws.length} 語 ／ まちがえた ${wrongSet.size} 語は復習に回りました</div>

        <div class="fin-row" id="r1">
          <span class="k">第 ${L.unit.no} 単元<div class="fin-ubar"><i id="ub"></i></div></span>
          <span class="v">${doneN} / ${mine.length}</span>
        </div>
        ${nx ? `<div class="unlock" id="r2"><b>NEXT</b>
          <span>${esc(nx.title)}　<span style="color:var(--tx3);font-weight:400">${esc(nx.ws.slice(0,3).join("・"))}…</span></span></div>` : ""}
        <button class="cta" onclick="P.again()">${nx ? "次の課へ ›" : "一覧へ"}</button>
        <p style="margin-top:14px"><a href="javascript:void(0)" onclick="P.quit()" style="color:var(--tx3);font-size:13px">一覧にもどる</a></p>
      </div>`;
    // 1) 点数が数え上がる
    const ring = $("ring"), rv = $("ringv");
    setTimeout(()=>{ ring.style.strokeDashoffset = String(C * (1 - pct/100)); }, 80);
    let n = 0; const t = setInterval(()=>{ n += Math.max(1, Math.ceil(pct/28)); if (n >= pct){ n = pct; clearInterval(t); } rv.textContent = n + "%"; }, 32);
    // 2) 単元の進度条が「さっきまでの位置から」伸びる
    setTimeout(()=>{ $("r1").classList.add("in"); const ub = $("ub"); ub.style.width = before + "%";
      setTimeout(()=>{ ub.style.width = after + "%"; }, 260); }, 700);
    // 3) 次の課が開く
    setTimeout(()=>{ const r2 = $("r2"); if (r2) r2.classList.add("in"); }, 1250);
  }
  function again(){ const nx = nextLesson(); if (nx) start(nx.key); else quit(); }
  return { start, quit, next, pick, again, reset, say };
})();

let LV = (function(){ try { return localStorage.getItem("stw_proto_lv") || "l1"; } catch(e){ return "l1"; } })();
// vocab-*.js は const 宣言なので window には載らない(StayTW で何度も踏んでいる罠)。
// 名前で引けないので、素直に並べて typeof で見る。
const VOCAB_SETS = {
  l1: () => [typeof VOCAB_L1!=="undefined"&&VOCAB_L1, typeof VOCAB_L1_B!=="undefined"&&VOCAB_L1_B, typeof VOCAB_L1_C!=="undefined"&&VOCAB_L1_C],
  l2: () => [typeof VOCAB_L2!=="undefined"&&VOCAB_L2, typeof VOCAB_L2_B!=="undefined"&&VOCAB_L2_B, typeof VOCAB_L2_C!=="undefined"&&VOCAB_L2_C],
  l3: () => [typeof VOCAB_L3!=="undefined"&&VOCAB_L3, typeof VOCAB_L3_B!=="undefined"&&VOCAB_L3_B, typeof VOCAB_L3_C!=="undefined"&&VOCAB_L3_C],
  l4: () => [typeof VOCAB_L4!=="undefined"&&VOCAB_L4, typeof VOCAB_L4_B!=="undefined"&&VOCAB_L4_B, typeof VOCAB_L4_C!=="undefined"&&VOCAB_L4_C],
  l5: () => [typeof VOCAB_L5!=="undefined"&&VOCAB_L5, typeof VOCAB_L5_B!=="undefined"&&VOCAB_L5_B, typeof VOCAB_L5_C!=="undefined"&&VOCAB_L5_C],
  l6: () => [typeof VOCAB_L6!=="undefined"&&VOCAB_L6, typeof VOCAB_L6_B!=="undefined"&&VOCAB_L6_B, typeof VOCAB_L6_C!=="undefined"&&VOCAB_L6_C],
};
function lvWords(){
  const f = VOCAB_SETS[LV]; if (!f) return [];
  return f().filter(Array.isArray).flat();
}
function loadLevel(lv){
  LV = lv; try { localStorage.setItem("stw_proto_lv", lv); } catch(e){}
  for (const k in WORDS) delete WORDS[k];
  lvWords().forEach(v => { WORDS[v.w] = v; });
  $("levels").innerHTML = ["l1","l2","l3","l4","l5","l6"].map(x =>
    `<button class="${x===LV?"on":""}" onclick="loadLevel('${x}')">L${x.slice(1)}</button>`).join("");
  return fetch("data/lessons-"+lv+".json?v=2").then(r=>r.json()).then(d=>{ DATA = d; renderHome(); });
}
loadLevel(LV);
</script>
