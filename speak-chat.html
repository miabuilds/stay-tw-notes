<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情境対話｜StayTW（テスト版）</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#FAF8F3;--bg2:#FFF;--bg3:#F2EEE5;--tx:#1C1C1E;--tx2:#6A6A6A;--tx3:#A9A9A9;--ac:#B8362A;--ac-soft:rgba(184,54,42,.08);--ok:#2F7A5D;--bd:#E5DECF;--line:#DDD5C0;--ease:cubic-bezier(.25,.1,.25,1);--serif:"Hiragino Mincho ProN","Noto Serif JP","Songti TC",serif}
[data-theme="dark"]{--bg:#121113;--bg2:#1B1A1C;--bg3:#1F1E20;--tx:#EDE8DE;--tx2:#8F8A7E;--tx3:#5D5A53;--ac:#E4715F;--ac-soft:rgba(228,113,95,.1);--ok:#4C9B7A;--bd:#2C2A27;--line:#2C2A27}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10;display:flex;align-items:center;gap:10px;padding:12px 18px}
.hd .brand{font-family:var(--serif);font-size:15px;font-weight:700}
.hd .badge{font-size:10.5px;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:1px 8px;font-weight:700}
.hd .lang{margin-left:auto;background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);padding:3px 11px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit}
.hd .back{background:none;border:none;color:var(--tx);cursor:pointer;width:44px;height:44px;margin-left:-10px;display:inline-grid;place-items:center;border-radius:50%;padding:0;font-family:inherit}.hd .back:active{background:var(--bg3,rgba(0,0,0,.06))}
main{flex:1;padding:18px}
/* シーン選択 */
.intro h1{font-family:var(--serif);font-size:22px;text-align:center;margin:10px 0 4px}
.intro p{font-size:13.5px;color:var(--tx2);text-align:center;margin-bottom:22px}
.intro p.sndnote{display:flex;align-items:center;justify-content:center;gap:6px;margin:-12px 0 18px;font-size:12.5px;color:var(--ac);font-weight:600}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scene{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;transition:.15s var(--ease)}
.scene:active{transform:translateY(1px)}
@media(hover:hover){.scene:hover{border-color:var(--ac)}}
.scene .em{font-size:32px;display:block;margin-bottom:8px}
.scene .nm{font-size:14px;font-weight:700}
.scene .rl{font-size:11.5px;color:var(--tx3);margin-top:2px}
/* チャット */
.chat{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.msg{max-width:88%}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end}
.bub{border-radius:16px;padding:12px 15px;font-size:16px}
.msg.ai .bub{background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me .bub{background:var(--ac);color:#fff;border-bottom-right-radius:5px}
.bub .zh{font-family:var(--serif);font-size:18px;line-height:1.6}
.bub .zy{font-size:11.5px;color:var(--ac);margin-top:4px;line-height:1.5}
.bub .tr{font-size:13px;color:var(--tx2);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);display:none}
.bub .tr.show{display:block}
.mrow{display:flex;gap:8px;align-items:center;margin-top:6px;padding-left:4px}
.mrow button{background:none;border:none;color:var(--tx3);font-size:11.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px}
.mrow button:active{color:var(--ac)}
.ic{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.corr{align-self:flex-start;max-width:88%;background:#FFF6E5;border:1px solid #E9D9A8;border-radius:12px;padding:9px 13px;font-size:13px;color:#7a5c17}
[data-theme="dark"] .corr{background:#2a2410;border-color:#4a3f18;color:#d8c98a}
.typing{align-self:flex-start;color:var(--tx3);font-size:14px;padding:8px 4px}
.typing span{animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.err{align-self:center;color:var(--ac);font-size:13px;text-align:center;padding:6px}
/* 入力バー */
.hints{padding:14px 18px 14px}
.hints:empty{display:none}
.hint-toggle{background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);border-radius:999px;padding:8px 15px;font-size:13px;font-family:var(--serif);cursor:pointer}
.hints-lb{font-size:12px;color:var(--tx2);margin-bottom:9px}
.hint-row{display:flex;gap:9px;flex-wrap:wrap}
.hint-wrap{display:inline-flex;align-items:stretch;border:1px solid var(--ac);border-radius:999px;overflow:hidden}
.hint-chip{background:var(--ac-soft);color:var(--ac);border:none;padding:8px 8px 8px 15px;font-size:14px;font-family:var(--serif);cursor:pointer;line-height:1.3}
.hint-chip:active{transform:translateY(1px)}
.hint-spk{background:var(--ac-soft);color:var(--ac);border:none;border-left:1px solid var(--ac);padding:0 12px;cursor:pointer;font-size:13px}
.hint-spk:active{background:var(--ac);color:#fff}
.inbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.inbar input{flex:1;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:999px;padding:12px 18px;font-size:16px;font-family:var(--serif)}
.inbar input:focus{outline:none;border-color:var(--ac)}
.inbar button{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ac);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.inbar button:disabled{opacity:.4}
.inbar button.mic{background:var(--bg2);color:var(--tx);border:1px solid var(--bd)}
.inbar button.mic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inbar button.mic.rec{background:#e5484d;color:#fff;border-color:#e5484d;animation:micpulse 1s infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 8px rgba(229,72,77,0)}}
.micnote{display:none;font-size:12px;color:var(--tx2);text-align:center;padding:6px 14px 0}
.favstar.on{color:var(--ac)}
.favwrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}
.favh{font-size:19px;margin:6px 0 16px;color:var(--tx)}
.favitem{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.favitem .fzh{font-size:17px;color:var(--tx);font-family:var(--serif)}
.favitem .fzy{font-size:12px;color:var(--ac);margin-top:3px}
.favitem .ftr{font-size:13px;color:var(--tx2);margin-top:5px}
.favact{display:flex;gap:6px;flex:none}
.favact button{background:none;border:1px solid var(--bd);border-radius:9px;padding:6px 9px;cursor:pointer;font-size:14px}
.favempty{color:var(--tx2);text-align:center;padding:40px 0;font-size:14px}
.favlink{margin-top:14px;background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:999px;padding:8px 16px;font-size:13px;font-family:var(--serif);cursor:pointer}
.intro-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.endbtn{margin-left:auto;background:var(--ac);color:#fff;border:none;border-radius:999px;padding:7px 14px;font-size:13px;font-family:var(--serif);cursor:pointer;white-space:nowrap}
.endbtn:active{opacity:.85}
.rvwrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.rv-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ring{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700;flex:none}
.rv-htext{font-size:16px;font-weight:700;color:var(--tx)}
.rv-line{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14.5px;color:var(--tx);line-height:1.6}
.rv-line .lb{display:inline-block;font-size:11px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.rv-enc{color:var(--ok);font-weight:600;text-align:center;padding:8px 0 0}
.rv-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.rv-btns button{flex:1;min-width:120px;border-radius:999px;padding:11px;font-size:14px;font-family:var(--serif);cursor:pointer;border:1px solid var(--ac)}
.rv-btns .primary{background:var(--ac);color:#fff;border:none}
.rv-btns .ghost{background:none;color:var(--ac)}
.logitem{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-family:var(--serif)}
.logscore{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.logmeta{flex:1;min-width:0}
.logmeta .lt{font-size:15px;color:var(--tx)}
.logmeta .ld{font-size:12px;color:var(--tx2);margin-top:2px}
.logdel{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:15px;flex:none}
.micnote.on{display:block}
.cta{margin:20px 18px;border:2px solid var(--ac);border-radius:14px;padding:18px;background:var(--bg2);text-align:center}
.cta p{font-size:13.5px;color:var(--tx2);margin-bottom:12px}
.cta a{display:inline-block;background:var(--ac);color:#fff;font-weight:700;font-size:14px;padding:11px 22px;border-radius:999px;text-decoration:none}
.lvrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:-8px 0 18px}
.lvbtn{border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.25;text-align:center}
.lvbtn small{display:block;font-size:10px;color:var(--tx3)}
.lvbtn.on{background:var(--ac);border-color:var(--ac);color:#fff}.lvbtn.on small{color:rgba(255,255,255,.8)}
.custom-hero{display:flex;align-items:center;gap:12px;width:100%;background:var(--ac-soft);border:1.5px dashed var(--ac);border-radius:16px;padding:14px 16px;margin-bottom:14px;cursor:pointer;font-family:inherit;text-align:left;color:var(--tx)}
.custom-hero b{font-size:15px;display:block}.custom-hero span{font-size:12px;color:var(--tx2)}
.explored{font-size:12px;color:var(--tx3);text-align:center;margin:14px 0 0}
.scene .done{display:block;font-size:10.5px;color:var(--ok);margin-top:4px}
.cf{display:flex;flex-direction:column;gap:12px}
.cf label{font-size:12.5px;color:var(--tx2);display:flex;flex-direction:column;gap:5px}
.cf input,.cf textarea{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit}
.cf textarea{min-height:64px;resize:vertical}
.cf .go{background:var(--ac);color:#fff;border:none;border-radius:999px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.tozh{display:flex;gap:8px;padding:0 14px 8px}
.tozh button{background:none;border:1px dashed var(--bd);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.msg{scroll-margin-top:64px}
.bub .zh ruby{ruby-position:over}
.rb{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 1px}
.rb .rt{font-family:-apple-system,"PingFang TC",sans-serif;font-size:10.5px;color:var(--ac);letter-spacing:0;line-height:1.15;white-space:nowrap}
.rb .rc{line-height:1.3}
.favitem .fzh .rb .rt{font-size:10px}
.bub .zh rt{font-family:-apple-system,"PingFang TC",sans-serif;font-size:10.5px;color:var(--ac);letter-spacing:0;line-height:1.1}
.bub .zh{line-height:2.15}
.favitem .fzh rt{font-size:10px;color:var(--ac)}
</style>

<script src="py2zy.js?v=4"></script>
<script src="tbcl.js?v=1"></script>

    <span class="brand">台湾華語スタディ</span>
    <button class="endbtn" id="endBtn" onclick="endReview()" style="display:none"></button>
    <button class="lang" id="langBtn" onclick="cycleLang()">日</button>

  <main id="main"></main>
  <div class="hints" id="hints"></div>
  <div id="micNote" class="micnote"></div>
  <div class="tozh" id="toZhRow" style="display:none"><button onclick="toZh()" id="toZhBtn"></button></div>

</div>

// ── 音声(読み上げ)──
function bestVoice(){
  try{ var vs=speechSynthesis.getVoices();
    var tw=vs.filter(v=>/zh-TW|zh_TW|cmn-Hant|Taiwan/i.test(v.lang)||/Mei-?Jia|美佳|台/i.test(v.name));
    // 台湾の声だけ。無ければ null(大陸の声で代用しない)
    tw.sort((a,b)=>(/enhanced|premium|siri|neural|natural|美佳|Mei-?Jia/i.test(b.name)?1:0)-(/enhanced|premium|siri|neural|natural|美佳|Mei-?Jia/i.test(a.name)?1:0));
    return tw[0]||null;
  }catch(e){ return null; }
}
const TTS_FIX=[[/[台臺]北101/g,"台北一零一"],[/101大樓/g,"一零一大樓"],[/microsoft|Microsoft/g,"微軟"]];
function ttsText(t){ t=String(t||""); TTS_FIX.forEach(function(p){ t=t.replace(p[0],p[1]); }); return t; }
function browserSpeak(txt){try{if(!txt)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(ttsText(txt));u.rate=.96;u.pitch=1.02;var v=bestVoice();if(v){u.voice=v;u.lang=v.lang;}else{if(speechSynthesis.getVoices().length)return;u.lang="zh-TW";}speechSynthesis.speak(u);}catch(e){}}

function phOf(txt){
  try{ const zya=zyFromPy(txt,""); return [...String(txt)].map((c,i)=>zya[i]?{c,ph:zya[i]}:null).filter(Boolean); }catch(e){ return []; }
}
async function speak(txt, voice, zya){
  if(!txt) return; if(recording) return;   // 録音中は鳴らさない(自分の声を拾う)
  var say=ttsText(txt), seq=++_ttsSeq, key="v3|"+(voice||"f")+"|"+say;
  var ph=(zya&&zya.length)?[...String(txt)].map((c,i)=>zya[i]?{c,ph:zya[i]}:null).filter(Boolean):phOf(say);
  // 読み指定は破音字だけ。全字に当てると Azure の抑揚・軽声・変調が崩れて聲調が不自然になる(ユーザー指摘 2026-10)
  var POLY_CH=new Set((window.POLYPHONE||[]).map(p=>p.c));
  ph=ph.filter(x=>POLY_CH.has(x.c));
  try{
    var b64=_ttsCache[key];
    if(b64===undefined){
      var r=await fetch("/api/tts",{method:"POST",headers:authH(),body:JSON.stringify({el:1,text:say,voice:voice||"f",ph:ph.map(x=>({c:x.c,ph:x.ph,py:(window.zy2py?window.zy2py(x.ph):"")}))})});
      b64 = r.ok ? ((await r.json()).audio||null) : null; _ttsCache[key]=b64;
    }
    if(seq!==_ttsSeq) return;
    if(b64){ speechSynthesis.cancel(); if(!_audio)_audio=new Audio(); _audio.src="data:audio/mp3;base64,"+b64; _audio.play().catch(function(){ browserSpeak(txt); }); return; }

// ── 注音:1 字ずつ。正本は官方 TBCL 詞語表(教育部の読み)──
//   ① 文を TBCL の語(2〜4 字)で最長一致に切り、語の中の字は官方の読みをそのまま使う(什麼・便當・還是)
//   ② 語にならない 1 字は、AI の拼音がその字のあり得る読みなら AI のを使う(行 ㄒㄧㄥˊ/ㄏㄤˊ、一・不 の変調を文脈で)
//      あり得ない読み(台語ローマ字・別の字)なら TBCL の単字の読み。それも無ければその字だけ空ける
//   AI の拼音は漢字が混じる・台語で書く・語をくっつける、で 17 文中 6 文が使えなかった(2026-10)。AI だけに頼らない
const TONE_PLAIN={"ā":"a","á":"a","ǎ":"a","à":"a","ē":"e","é":"e","ě":"e","è":"e","ī":"i","í":"i","ǐ":"i","ì":"i","ō":"o","ó":"o","ǒ":"o","ò":"o","ū":"u","ú":"u","ǔ":"u","ù":"u","ǖ":"v","ǘ":"v","ǚ":"v","ǜ":"v","ü":"v","ê":"e"};
const plainPy=x=>String(x).toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüê]/g,c=>TONE_PLAIN[c]||c);
const SYL_RE=/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(iang|iong|uang|ueng|ian|iao|ing|uai|uan|van|ang|eng|ong|ia|ie|iu|in|ua|uo|ui|un|ve|vn|ai|ei|ao|ou|an|en|er|a|o|e|i|u|v)(r)?$/;
const isSyl=x=>SYL_RE.test(plainPy(x).replace(/[^a-z]/g,""));
// くっついた語(háishi)を音節に切る:前から最長一致
function splitSyl(tok){
  const out=[]; let i=0, t=String(tok);
  while(i<t.length){ let hit=0; for(let n=Math.min(6,t.length-i);n>=1;n--){ if(isSyl(t.substr(i,n))){ hit=n; break; } } if(!hit) return null; out.push(t.substr(i,hit)); i+=hit; }
  return out;
}
const zyNorm=z=>String(z||"").trim().split(/\s+/).filter(Boolean).map(t=>t.replace(/^(.+)˙$/,"˙$1"));
const zyPlain=z=>String(z).replace(/[ˊˇˋ˙]/g,"");
function knownReadings(ch){
  const set=new Set();
  try{ const t=(window.STW_TBCL||{})[ch]; if(t) set.add(zyPlain(zyNorm(t[1])[0]||"")); }catch(e){}
  try{ (window.POLYPHONE||[]).forEach(p=>{ if(p.c===ch) p.r.forEach(r=>set.add(zyPlain(r.zy))); }); }catch(e){}
  return set;
}
// 台灣と大陸で声調だけ違う字(scripts/tw-readings.py の TW_FIX と同じ+α)。語の中なら TBCL が先に効く
const TW_TONE={"微":"ㄨㄟˊ","期":"ㄑㄧˊ","危":"ㄨㄟˊ","企":"ㄑㄧˋ","識":"ㄕˋ","息":"ㄒㄧˊ","惜":"ㄒㄧˊ","擊":"ㄐㄧˊ","寂":"ㄐㄧˊ","築":"ㄓㄨˊ","髮":"ㄈㄚˇ","突":"ㄊㄨˊ","夕":"ㄒㄧˋ","播":"ㄅㄛˋ","綜":"ㄗㄨㄥˋ","椰":"ㄧㄝˊ","烊":"ㄧㄤˊ","斂":"ㄌㄧㄢˋ","跌":"ㄉㄧㄝˊ","鞠":"ㄐㄩˊ","擲":"ㄓˊ","偽":"ㄨㄟˋ","績":"ㄐㄧ","跡":"ㄐㄧ","悄":"ㄑㄧㄠˇ","研":"ㄧㄢˊ","質":"ㄓˊ","暫":"ㄓㄢˋ","垃":"ㄌㄜˋ","圾":"ㄙㄜˋ","蝸":"ㄍㄨㄚ","骰":"ㄊㄡˊ","癌":"ㄧㄢˊ","携":"ㄒㄧ","攜":"ㄒㄧ"};
function zyFromPy(zh, py){
  try{
    const T=window.STW_TBCL||{}, chars=[...String(zh||"")], idx=[];
    chars.forEach((c,i)=>{ if(/[\u3400-\u9fff]/.test(c)) idx.push(i); });
    const out=new Array(chars.length).fill("");
    // AI の拼音を音節列に(漢字や記号は捨て、くっついた語は切る。切れない語=台語ローマ字などは null)
    let ai=[];
    for(const tok of String(py||"").replace(/[\u3400-\u9fff]+/g," ").split(/[\s,.!?，。！？、]+/).filter(Boolean)){
      const sp=splitSyl(tok.replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüê]/gi,"")); if(!sp){ ai=null; break; } ai.push(...sp);
    }
    const aligned=ai && ai.length===idx.length;
    const hz=idx.map(i=>chars[i]).join("");
    for(let k=0;k<hz.length;){
      let w="";
      for(let n=Math.min(4,hz.length-k);n>=2;n--){ const t=hz.substr(k,n); if(T[t] && zyNorm(T[t][1]).length===n){ w=t; break; } }
      if(w){ zyNorm(T[w][1]).forEach((z,j)=>out[idx[k+j]]=z); k+=w.length; continue; }
      const ch=hz[k]; let z="";
      if(aligned && typeof window.py2zy==="function"){
        const cand=String(window.py2zy(ai[k])||"").replace(/^(.+)˙$/,"˙$1");
        const kn=knownReadings(ch);
        if(/[ㄅ-ㄩ]/.test(cand) && (!kn.size || kn.has(zyPlain(cand)))) z=cand;
      }
      if(!z && T[ch]) z=zyNorm(T[ch][1])[0]||"";
      // AI の拼音は大陸の声調で来ることがある(微 wēi・期 qī・危 wēi…)。台灣(教育部)の声調に直す
      if(z && TW_TONE[ch] && zyPlain(z)===zyPlain(TW_TONE[ch])) z=TW_TONE[ch];
      out[idx[k]]=z; k++;
    }
    return out;
  }catch(e){ return []; }
}
// 1 字ずつ上に注音。読みが分からない字は注音なしで残す(全体を消さない)
function rubyHTML(zh, zya){
  if(!zya || !zya.length) return esc(zh);
  // <ruby> は iOS で注音が字より広いと隣に重なって一塊になる(2026-10 実機)。字+注音を一つの箱にして幅を確保する
  // 記号も同じ箱に入れて高さをそろえる。句読点は前の字の箱にくっつけて、行頭に一つだけ落ちないように
  const PUN=/^[，。！？、；：」』）…,.!?;:)]$/; const cells=[];
  [...String(zh)].forEach((c,i)=>{ if(PUN.test(c) && cells.length){ cells[cells.length-1].c+=c; return; } cells.push({z:zya[i]||"",c}); });
  return cells.map(x=>'<span class="rb"><span class="rt">'+(x.z ? esc(x.z) : '&nbsp;')+'</span><span class="rc">'+esc(x.c)+'</span></span>').join("");
}

  const l=favList();
  const body=l.length? l.map((x,i)=>'<div class="favitem"><div class="favtx"><div class="fzh">'+rubyHTML(x.reply,x.zya||zyFromPy(x.reply,""))+'</div>'+(x.translation?'<div class="ftr">'+esc(x.translation)+'</div>':'')+'</div><div class="favact"><button onclick="speak('+esc(JSON.stringify(x.reply))+')">'+icon("volume",{size:15})+'</button><button onclick="removeFav('+i+')">'+icon("trash",{size:15})+'</button></div></div>').join("") : '<div class="favempty">'+tt("favEmpty")+'</div>';
  main().innerHTML='<div class="favwrap"><h2 class="favh">'+tt("favTitle")+'</h2>'+body+'</div>';
}
// ── 採点
function scoreColor(sc){ return sc>=85?"var(--ok)":sc>=60?"#C98A00":"var(--ac)"; }
async function endReview(){
  resetBack();
  if(busy||_reviewBusy) return;
  if(!curScene || !history.some(m=>m.role==="me")){ toIntro(); return; }
  _reviewBusy=true; hardStopRec(); hideEnd(); showBar(false);
  const sc=curScene;
  document.getElementById("hints").innerHTML=""; document.getElementById("backBtn").style.display="";
  main().innerHTML='<div class="rvwrap"><div style="padding:30px 0;text-align:center;color:var(--tx2)">'+tt("reviewing")+'</div></div>';
  window.scrollTo(0,0);
  try{
    const r=await fetch("/api/speak-review",{method:"POST",headers:authH(),
      body:JSON.stringify({scene:sc.scene,userRole:L(sc.rl),level:LV,lang:LANG,
        history:history.filter(m=>m.role==="ai"||m.role==="me").map(m=>({role:m.role==="me"?"me":"ai",text:m.role==="me"?m.text:m.reply}))})});
    if(!r.ok){ let d={};try{d=await r.json();}catch(e){} main().innerHTML='<div class="rvwrap"><div class="err">'+(d.error==="quota"?tt("quota"):tt("err"))+'</div><div class="rv-btns"><button class="ghost" onclick="toIntro()">'+tt("startOver")+'</button></div></div>'; return; }
    const rv=await r.json();
    bumpCount(sc.id); saveLogEntry(sc, rv); renderReviewScreen(sc, rv);
  }catch(e){ main().innerHTML='<div class="rvwrap"><div class="err">'+tt("err")+'</div><div class="rv-btns"><button class="ghost" onclick="toIntro()">'+tt("startOver")+'</button></div></div>'; }
  finally{ _reviewBusy=false; }
}
function reviewLinesHTML(rv){
  return (rv.good?'<div class="rv-line"><span class="lb">'+tt("rvGood")+'</span>'+esc(rv.good)+'</div>':'')
    +(rv.improve?'<div class="rv-line"><span class="lb">'+tt("rvImprove")+'</span>'+esc(rv.improve)+'</div>':'')
    +(rv.tip?'<div class="rv-line"><span class="lb">'+tt("rvTip")+'</span>'+esc(rv.tip)+'</div>':'')
    +(rv.encourage?'<div class="rv-enc">'+esc(rv.encourage)+'</div>':'');
}
let _lastCustom=null;
function renderReviewScreen(sc, rv){
  const has=rv.score!=null, s=Number(rv.score)||0;
  if(sc.id==="custom") _lastCustom=sc;
  const head=has?'<div class="rv-head"><div class="ring" style="background:'+scoreColor(s)+'">'+s+'</div><div class="rv-htext">'+tt("rvHead")+'<div style="font-size:12px;font-weight:400;color:var(--tx2)">'+esc(L(sc.nm))+' ・ '+LV+'</div></div></div>':'';
  main().innerHTML='<div class="rvwrap">'+head+reviewLinesHTML(rv)+
    '<div class="rv-btns"><button class="primary" onclick="'+(sc.id==="custom"?'startScene(null,_lastCustom)':'startScene(\''+sc.id+'\')')+'">'+tt("again")+'</button>'+
    '<button class="ghost" onclick="toIntro()">'+tt("startOver")+'</button>'+
    '<button class="ghost" onclick="openLogs()">'+tt("logsTitle")+'</button></div></div>';
}
// ── 会話の記録(最近 20 場)
const LOG_KEY="stw-chat-logs";
function logList(){try{return JSON.parse(localStorage.getItem(LOG_KEY)||"[]");}catch(e){return[];}}
function logSaveAll(l){try{localStorage.setItem(LOG_KEY,JSON.stringify(l.slice(0,20)));}catch(e){}}
function saveLogEntry(sc, rv){
  const msgs=history.filter(m=>m.role==="me"||m.role==="ai").map(m=>m.role==="me"?{r:"me",t:m.text||""}:{r:"ai",t:m.reply||"",zya:m.zya||[],tr:m.translation||""}).filter(m=>m.t);
  if(!msgs.length) return;
  const l=logList();
  l.unshift({t:Date.now(),id:sc.id,em:sc.em||"chat",nm:L(sc.nm),lv:LV,score:(rv.score==null?null:Number(rv.score)),good:rv.good||"",improve:rv.improve||"",tip:rv.tip||"",encourage:rv.encourage||"",msgs});
  logSaveAll(l);
}
function removeLog(i){ const l=logList(); l.splice(i,1); logSaveAll(l); openLogs(); }
function openLogs(){
  resetBack();
  curScene=null; history=[]; hardStopRec(); hideEnd(); showBar(false);
  document.getElementById("hints").innerHTML=""; document.getElementById("backBtn").style.display="";
  const l=logList();
  const body=l.length? l.map((x,i)=>{ const has=x.score!=null;
    const ring=has?'<div class="logscore" style="background:'+scoreColor(x.score)+'">'+x.score+'</div>':'<div class="logscore" style="background:var(--tx3)">–</div>';
    const d=new Date(x.t); const dd=(d.getMonth()+1)+"/"+d.getDate();
    return '<div class="logitem" onclick="viewLog('+i+')">'+ring+'<div class="logmeta"><div class="lt">'+icon(x.em||"chat",{size:15})+' '+esc(x.nm)+'</div><div class="ld">'+dd+(x.lv?' ・ '+x.lv:'')+' ・ '+x.msgs.filter(m=>m.r==="me").length+' '+tt("turns")+'</div></div><button class="logdel" onclick="event.stopPropagation();removeLog('+i+')">'+icon("trash",{size:15})+'</button></div>';
  }).join("") : '<div class="favempty">'+tt("logsEmpty")+'</div>';
  main().innerHTML='<div class="favwrap"><h2 class="favh">'+tt("logsTitle")+'</h2>'+body+'</div>';
}
function viewLog(i){
  const x=logList()[i]; if(!x)return;
  document.getElementById("backBtn").style.display="";
  const chat=x.msgs.map(m=>m.r==="me"
    ?'<div class="msg me"><div class="bub"><div class="zh">'+esc(m.t)+'</div></div></div>'
    :'<div class="msg ai"><div class="bub"><div class="zh">'+rubyHTML(m.t,m.zya||zyFromPy(m.t,""))+'</div>'+(m.tr?'<div class="tr show">'+esc(m.tr)+'</div>':'')+'</div><div class="mrow"><button onclick="speak('+esc(JSON.stringify(m.t))+')">'+icon("volume",{size:15})+' '+tt("play")+'</button></div></div>').join("");
  const has=x.score!=null;
  const head=has?'<div class="rv-head"><div class="ring" style="background:'+scoreColor(x.score)+'">'+x.score+'</div><div class="rv-htext">'+esc(x.nm)+'</div></div>':'';
  main().innerHTML='<div class="rvwrap">'+head+reviewLinesHTML(x)+'<div style="margin:16px 0 6px;font-size:12px;color:var(--tx2)">'+tt("logConvo")+'</div><div class="chat">'+chat+'</div><div class="rv-btns"><button class="ghost" onclick="openLogs()">‹ '+tt("logsTitle")+'</button></div></div>';
  window.scrollTo(0,0);
}

// 返答は 1 行 1 項目で流れてくる(REPLY / PINYIN / TR / HINT×2 / CORR)。REPLY が来た分から吹き出しに出す
function parseLines(t){
  const o={reply:"",pinyin:"",translation:"",hints:[],correction:""};
  String(t).split("\n").forEach(l=>{ const m=l.match(/^\s*(REPLY|PINYIN|TR|HINT|CORR)\s*[:：]\s*(.*)$/); if(!m) return;
    const v=m[2].trim(); if(m[1]==="REPLY")o.reply=v; else if(m[1]==="PINYIN")o.pinyin=v; else if(m[1]==="TR")o.translation=v; else if(m[1]==="HINT"){ if(v)o.hints.push(v); } else o.correction=v; });
  // 行の札が抜けた時(2026-10 実機で「通信エラー」になった):最初の札より前の文を返事として使う
  if(!o.reply){ const head=String(t).split(/\n\s*(?:PINYIN|TR|HINT|CORR)\s*[:：]/)[0].replace(/^\s*REPLY\s*[:：]/,"").trim(); if(head && /[\u3400-\u9fff]/.test(head) && !/^(PINYIN|TR|HINT|CORR)/.test(head)) o.reply=head.split("\n")[0].trim(); }
  return o;
}
// 台灣華語以外(台語専用の字 / 大陸の言い方)が出たら言い直し。台語専用の字(呷=吃・嘸/毋/袂=不・佇=在・恁/汝=你們/你・攏=都・佮=和・囝=孩子)。華語アプリなので出たら 1 回だけ言い直させる
const HOKKIEN_RE=/[呷嘸毋袂佇恁汝攏佮囝]|今日有|早上好|上午好|下午好|地鐵|出租車|視頻|軟件|網絡|打印|土豆/;   // 大陸の言い方も同じく言い直し
async function callAI(retry){
  busy=true; document.getElementById("sendBtn").disabled=true;
  renderChat(); showTyping(true); renderHints([]); anchorLatest(true);
  let liveEl=null, spokeEarly=false, earlyText="";
  try{ if(_audio) _audio.pause(); }catch(e){}
  try{
    const r=await fetch("/api/speak-chat",{method:"POST",headers:authH(),
      body:JSON.stringify({sid:SID,strict:retry?1:0,scene:curScene.scene,userRole:L(curScene.rl),level:LV,lang:LANG,
        history:history.filter(m=>m.role==="ai"||m.role==="me").map(m=>({role:m.role==="me"?"user":"ai",text:m.role==="me"?m.text:m.reply}))})});
    if(!r.ok){
      showTyping(false); let d={}; try{d=await r.json();}catch(e){}
      if(d.error==="sessions"){ const mine=history.pop(); renderChat(); try{ document.getElementById("inp").value=(mine&&mine.text)||""; }catch(e){} return showNoLeft(d); }   // 送った句は戻す(数えていない)
      const c=document.getElementById("chat"); if(c)c.insertAdjacentHTML("beforeend",'<div class="err"><img src="images/il/14_error.webp" alt="" width="84" height="84" style="display:block;width:84px;height:84px;margin:0 auto 6px">'+(d.error==="quota"?tt("quota"):tt("err"))+'</div>'); return;
    }
    const rd=r.body.getReader(), dec=new TextDecoder(); let full="";
    for(;;){
      const {value,done}=await rd.read(); if(done) break;
      full+=dec.decode(value,{stream:true});
      const part=parseLines(full);
      if(part.reply){
        showTyping(false);
        if(!liveEl){ const c=document.getElementById("chat"); c.insertAdjacentHTML("beforeend",'<div class="msg ai" id="live"><div class="bub"><div class="zh"></div></div></div>'); liveEl=document.getElementById("live"); anchorLatest(true); }
        liveEl.querySelector(".zh").textContent=part.reply;
      }
      // 聲音を早く:REPLY と PINYIN の行が出そろった時点で読み上げ開始(TR/HINT の生成を待たない。2026-10 Mia「聲音出現好慢」)
      if(!spokeEarly && part.reply && part.pinyin && /PINYIN\s*[:：][^\n]*\n/.test(full) && !HOKKIEN_RE.test(part.reply)){
        spokeEarly=true; earlyText=part.reply; speak(part.reply, curScene.voice, zyFromPy(part.reply, part.pinyin));
      }
    }
    showTyping(false);
    const ai=parseLines(full); ai.role="ai";
    if(!ai.reply){ const c=document.getElementById("chat"); if(c)c.insertAdjacentHTML("beforeend",'<div class="err">'+tt("err")+'</div>'); return; }
    if(!retry && HOKKIEN_RE.test(ai.reply+ai.hints.join(""))){ if(liveEl) liveEl.remove(); try{ _ttsSeq++; if(_audio) _audio.pause(); }catch(e){} return callAI(true); }
    ai.zya=zyFromPy(ai.reply, ai.pinyin);        // 1 字ずつの注音(官方詞表優先)
    if(ai.correction) history.push({role:"corr",text:ai.correction});
    history.push(ai);
    renderChat(); renderHints(ai.hints); if(!spokeEarly || ai.reply!==earlyText) speak(ai.reply, curScene.voice, ai.zya);
    if(!history.some(m=>m.role==="me") && QUOTA && QUOTA.left<=0){ showNoLeft(QUOTA); return; }
    if(ai.correction){ const c=document.getElementById("chat"); const el=c&&c.children[c.children.length-2]; if(el) el.scrollIntoView({block:"start",behavior:"smooth"}); } else anchorLatest(true);
    if(history.filter(m=>m.role==="me").length>=MAX_TURNS){
      const c=document.getElementById("chat"); if(c)c.insertAdjacentHTML("beforeend",'<div class="corr">'+tt("capMsg")+'</div>');
      setTimeout(function(){ if(curScene) endReview(); }, 1800);
    }
  }catch(e){ showTyping(false); const c=document.getElementById("chat"); if(c)c.insertAdjacentHTML("beforeend",'<div class="err">'+tt("err")+'</div>'); }
  finally{ busy=false; document.getElementById("sendBtn").disabled=false; }
}
// 今日の場数を使い切った
function showNoLeft(d){
  hardStopRec(); showBar(false); document.getElementById("hints").innerHTML=""; hideEnd();
  const prem=d&&d.premium, logged=d&&d.loggedIn;
  const inApp=!!window.ReactNativeWebView;
  main().insertAdjacentHTML("beforeend",'<div class="cta"><p>'+(prem?tt("noLeftPrem"):tt("noLeftFree"))+'</p>'+
    (prem?'':'<a href="/?app=1&pw=aichat">'+tt("seePrem")+'</a>'+(logged?'':'<p style="margin:12px 0 0;font-size:12.5px">'+tt("loginHint")+' <a style="background:none;color:var(--ac);padding:0;font-weight:700" href="/?app=1&login=1">'+tt("login")+'</a></p>'))+
    '</div>');
  const c=document.querySelector(".cta"); if(c) c.scrollIntoView({block:"center",behavior:"smooth"});
}
function send(){
  if(busy) return;                        // 入口で鎖(Enter 連打で同じ文が 2 回入らない)
  hardStopRec();
  const inp=document.getElementById("inp"); const v=(inp.value||"").trim(); if(!v) return;
  busy=true; inp.value=""; history.push({role:"me",text:v}); busy=false; callAI();
}
function showCta(){ showBar(false); document.getElementById("hints").innerHTML="";
  main().insertAdjacentHTML("beforeend",'<div class="cta"><p>'+tt("ctaP")+'</p><a href="/?utm_source=speakchat&lang='+LANG+'">'+tt("ctaBtn")+'</a></div>');}
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send();}});
// 録音中に手で直したら、そこで録音を止めて直した文を土台にする(遅れた認識で上書きしない)
document.getElementById("inp").addEventListener("input",e=>{ if(recording && e.isTrusted) hardStopRec(); });
window.stwBack=function(){ if(curScene||document.querySelector(".favwrap,.rvwrap")){ onBack(); return "handled"; } goHome(); return "handled"; };
if("speechSynthesis" in window)speechSynthesis.getVoices();
toIntro();
</script>
