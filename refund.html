en:{langBtn:"English",h1:"Refund Policy",
 intro:"This page explains the payment and refund terms of StayTW (an online Taiwanese Mandarin learning service). Please read before purchasing.",

 h2_2:"2. Subscriptions and Billing",
 p2:"Subscription plans (monthly/yearly) auto-renew. You may cancel anytime before the end of the current period; after cancellation you will not be charged for future periods, and fees already charged for the current period are non-refundable. The lifetime plan is a one-time payment with no renewal. Web card payments are processed by PayUni.",
 h2_3:"3. Exception to the 7-Day Cooling-Off Period",
 p3:"Under Taiwan's Consumer Protection Act and related rules, this Service is digital content or an online service that is completed upon delivery, provided with the consumer's prior consent; therefore the 7-day cooling-off period does not apply after purchase and activation.",
 h2_4:"4. Eligible Refund Cases",
 p4:"In cases such as duplicate charges, system errors, or a successful payment that was not activated, please contact us within 7 days of discovery with your transaction details (order number, payment time, amount). We will investigate and, once confirmed, process a refund within a reasonable period.",
 h2_5:"5. Contact",
 p5:'For refund or payment questions, email: <a href="mailto:stayjpplan@gmail.com">stayjpplan@gmail.com</a>. We will respond as soon as possible.',
 footer:"Last updated: August 2026"},
ko:{langBtn:"한국어",h1:"환불 정책",
 intro:"본 페이지는 StayTW(대만 화어 온라인 학습 서비스)의 결제 및 환불 규정을 설명합니다. 구매 전에 읽어 주세요.",
 h2_1:"1. 서비스의 성격",

 h2_4:"4. 환불 가능 사유",
 p4:"중복 청구, 시스템 오류, 결제는 성공했으나 개통되지 않은 경우 등에는 발견 후 7일 이내에 거래 정보(주문번호·결제일시·금액)를 첨부하여 문의해 주세요. 확인 후 합리적인 기간 내에 환불을 처리합니다.",
 h2_5:"5. 문의",
 p5:'환불·결제 관련 문의: <a href="mailto:stayjpplan@gmail.com">stayjpplan@gmail.com</a>. 최대한 빨리 답변드리겠습니다.',
 footer:"최종 업데이트: 2026년 8월"}
};
function curLang(){
  var q=(new URLSearchParams(location.search)).get("lang");
  if(q){q=q.toLowerCase(); if(q.indexOf("zh")===0||q==="tw")return"zh"; if(T[q])return q;}
  var s=localStorage.getItem("stw-lang"); if(s&&T[s])return s;
  return "zh";
}
var LANG=curLang();
function applyLang(){
  document.documentElement.lang=(LANG==="zh")?"zh-Hant":LANG;
  var d=T[LANG]||T.zh;
  document.getElementById("langToggle").textContent=d.langBtn;
  var _b=document.getElementById("backTxt"); if(_b)_b.textContent=({zh:"返回",ja:"戻る",en:"Back",ko:"뒤로"})[LANG]||"返回";
  document.querySelectorAll("[data-i18n]").forEach(function(el){var k=el.getAttribute("data-i18n");if(d[k]!==undefined)el.textContent=d[k];});
  document.querySelectorAll("[data-i18n-html]").forEach(function(el){var k=el.getAttribute("data-i18n-html");if(d[k]!==undefined)el.innerHTML=d[k];});
}
function cycleLang(){var o=["zh","ja","en","ko"];LANG=o[(o.indexOf(LANG)+1)%o.length];if(LANG!=="zh")localStorage.setItem("stw-lang",LANG);applyLang();}
function stwBack(){ if(history.length>1){ history.back(); } else { location.href="index.html"; } }
applyLang();
</script>
